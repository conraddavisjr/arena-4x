<!doctype html>
<meta charset="utf-8">
<title>ARENA-4X world</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  The 3D replay viewer.

  Same contract as the flat one: a pure function of the bundle, with no API
  client, no keys and no writes. What it adds is a camera you can orbit, which
  turns the one real objection to 3D - a mountain range hiding the army behind
  it - into the reason to move.

  three.js is vendored rather than pulled from a CDN so the page works offline
  and carries no third-party origin.
-->
<style>
  :root {
    --bg:#0b0f14; --panel:#12171f; --line:#222a35; --ink:#e6edf3; --dim:#8b949e; --faint:#4d5560;
    --c0:#4ade80; --c1:#fbbf24; --c2:#38bdf8; --c3:#f472b6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;overflow:hidden}
  main{position:relative;display:flex;flex-direction:column;min-width:0;
    height:100vh;overflow:hidden}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
  /* min-height:0 is what actually pins the scrubber. Without it a flex child
     refuses to shrink below its content, the stage grows past the viewport and
     pushes the scrubber off the bottom of the screen - which is exactly how it
     went missing. flex-shrink:0 on the bar then stops it being squeezed away on
     a short window. */
  #stage{flex:1;min-height:0;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}

  header{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:10px;align-items:center;
    padding:10px 14px;background:linear-gradient(#0b0f14ee,#0b0f1400);flex-wrap:wrap}
  /* `hidden` loses to any element with an explicit `display`, and several here
     have one - so hiding the scrubber by attribute silently did nothing. */
  [hidden]{display:none !important}
  h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.04em}
  /* Reads as the title, behaves as a button. */
  .brand{background:none;border:0;padding:0;font-size:13px;font-weight:600;
    letter-spacing:.04em;color:var(--ink)}
  .brand:hover{background:none;color:#cfe0ff}

  /* The match library. A dialog rather than a page, because it is a way back to
     the shelf rather than a place you stay. */
  #libWrap{position:fixed;inset:0;z-index:60;background:#040709d9;
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
  #libWrap[hidden]{display:none}
  #lib{width:100%;max-width:760px;max-height:82vh;display:flex;flex-direction:column;
    background:#0d1117;border:1px solid #33404f;border-radius:10px;
    box-shadow:0 24px 70px #000c;overflow:hidden}
  #lib header{position:static;padding:12px 14px;border-bottom:1px solid var(--line);
    display:flex;gap:10px;align-items:center;background:none}
  #lib h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em}
  #libFind{flex:1;background:#161c24;border:1px solid var(--line);border-radius:6px;
    padding:6px 9px;color:var(--ink);font:inherit;font-size:12px;min-width:0}
  #libList{overflow-y:auto;padding:6px}
  .match{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    padding:9px 10px;border-radius:7px;border:1px solid transparent;cursor:pointer}
  .match:hover{background:#151b23;border-color:#2a3441}
  .match.here{border-color:#2f6feb;background:#111a25}
  .match .star{background:none;border:0;padding:2px 4px;font-size:15px;line-height:1;
    color:#3d4652}
  .match .star.on{color:#fbbf24}
  .match .title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .match .who{display:flex;gap:5px;align-items:center;margin-top:3px}
  .match .sub{color:var(--dim);font-size:11px;margin-top:2px}
  .match .right{text-align:right;color:var(--dim);font-size:11px;white-space:nowrap}
  .match .rename{background:none;border:0;color:var(--faint);font-size:11px;padding:0 3px}
  .match .rename:hover{background:none;color:#cfe0ff}
  .approx{color:var(--faint)}
  button{background:#1b222c;color:var(--ink);border:1px solid var(--line);padding:5px 10px;
    border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
  button:hover{background:#28313d}
  button[aria-pressed="true"]{background:#2f6feb;border-color:#2f6feb}
  .scrub{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);
    background:var(--panel);flex:0 0 auto;z-index:3}
  input[type=range]{flex:1;accent-color:#2f6feb}
  .turn{font-variant-numeric:tabular-nums;min-width:96px;color:var(--dim)}
  .hint{position:absolute;bottom:8px;left:14px;color:var(--faint);font-size:11px;z-index:2}

  details{border-bottom:1px solid var(--line)}
  details > div{padding:0 14px 12px}
  summary{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    font-weight:600;padding:10px 14px;cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:8px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";font-size:11px;color:var(--dim);width:9px}
  details[open] > summary::before{content:"▾"}
  summary:hover{color:var(--ink)}
  /* The count on a closed section. Empty ones stay quiet rather than showing a
     zero, so the eye only goes to sections with something to say. */
  summary i{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;
    margin-left:auto;font-size:11px}
  summary i.hot{color:#4ade80}
  /* Stacked bars, pure CSS. A chart library would be the fifth dependency and
     the first one that has to be vendored for an offline page. */
  .sigrow{padding:6px 0;border-bottom:1px solid #1a212b}
  .sigrow:last-of-type{border-bottom:none}
  .sigrow .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
  .sigrow .tags{margin-left:auto;display:flex;gap:4px}
  .tag{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:3px;
    padding:0 5px;font-weight:500}
  .tag.bad{color:#f87171;border-color:#5c2424}
  .metric{display:flex;align-items:center;gap:8px;margin:2px 0}
  .metric label{width:52px;color:var(--faint);font-size:11px}
  .metric .n{color:var(--faint);font-size:11px;min-width:38px;text-align:right}
  .metric.clickable{cursor:pointer}
  .metric.clickable:hover label{color:var(--ink)}
  .fights{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .fights .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px}
  .fights .who button{margin-left:auto}
  .fight{padding:4px 0 4px 8px;border-left:2px solid var(--line);margin-bottom:4px;
    color:var(--dim)}
  .fight.won{border-left-color:#4ade80}
  .fight.lost{border-left-color:#f87171}
  .k{font-weight:600}
  /* Production was grey, which in this palette is the colour of "nothing here"
     - every disabled label and faint caption is grey - so a civ out-producing
     the table looked like an empty bar. Violet rather than the combat purple
     below it, which is redder; the two never share a row. */
  .k.gold{color:#fbbf24}.k.sci{color:#38bdf8}.k.prod{color:#a78bfa}.k.food{color:#4ade80}
  .k.mil{color:#f87171}.k.pub{color:#4ade80}.k.dm{color:#f472b6}
  .bars{display:inline-flex;width:100%;height:8px;border-radius:2px;overflow:hidden;
    background:#1b222c;min-width:56px}
  .bars i{display:block;height:100%}
  .bars i.gold{background:#fbbf24}
  .bars i.sci{background:#38bdf8}
  .bars i.prod{background:#a78bfa}
  .bars i.mil{background:#f87171}
  .bars i.food{background:#4ade80}
  .bars i.war{background:#f87171}
  .bars i.wild{background:#a855f7}
  .bars i.pub{background:#4ade80}
  .bars i.dm{background:#f472b6}
  /* A seat that just changed how hard it is thinking. Same green as every other
     "this moved on this turn" mark in the panel - the dossier's edited badge,
     the live thread ring - so the eye learns one colour rather than three. */
  td.moved{color:#4ade80;font-weight:600}
  td.moved .arrow-up{font-size:8px;margin-left:3px;vertical-align:top}
  /* The science race and the war fronts. Both live under Signals because they
     answer the same question the panel exists for: who is quietly winning. */
  .race{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
  .racehead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--dim);margin-bottom:5px}
  .racehead .meta{text-transform:none;letter-spacing:0;margin-left:6px;cursor:help;
    text-decoration:underline dotted var(--faint);text-underline-offset:2px}
  .racerow{display:grid;grid-template-columns:9px 90px 1fr auto;gap:6px;
    align-items:center;margin:3px 0;font-size:11px}
  .racename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .racenote{color:var(--faint);font-size:10px;white-space:nowrap}
  /* A civ one build from ending the match is the most urgent fact on screen. */
  .racenote.close{color:#fbbf24;font-weight:600}
  .front{display:grid;grid-template-columns:9px auto 1fr auto 9px;gap:5px;
    align-items:center;margin:4px 0;font-size:11px}
  .frontname{white-space:nowrap;max-width:78px;overflow:hidden;text-overflow:ellipsis}
  .frontname.right{text-align:right}
  .slider{position:relative;display:flex;height:9px;border-radius:5px;overflow:hidden;
    background:#1b222c}
  .slider i{display:block;height:100%}
  /* The midpoint marker, so "leaning" is readable rather than estimated. */
  .slider b{position:absolute;top:-2px;width:2px;height:13px;background:var(--ink);
    opacity:.65;transform:translateX(-1px)}
  /* A coordinate or unit id the board can point at. Subtle until hovered -
     these appear many times per paragraph and must not turn prose into
     confetti. */
  .ref{border-bottom:1px dotted #6b7a8d;cursor:pointer;border-radius:3px;
    padding:0 2px;transition:background .08s}
  .ref:hover{background:#ffd16633;border-bottom-color:#ffd166;color:#ffe9b0}
  .ref.unit{border-bottom-style:solid}
  .ref.gone{border-bottom-color:#4d5560;color:var(--faint);cursor:help}
  /* Charts. Inline SVG and flexbox - no library, because the published artifact
     has to open offline with no external requests. */
  .chart{display:flex;gap:10px;align-items:center;margin-top:10px;
    padding-top:8px;border-top:1px solid var(--line)}
  .charthead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--dim);margin-bottom:4px}
  .dtotal{fill:var(--ink);font-size:15px;font-weight:600;text-anchor:middle;
    dominant-baseline:central;font-variant-numeric:tabular-nums}
  .sharelist{flex:1;min-width:0}
  .sharerow{display:grid;grid-template-columns:9px 1fr auto auto;gap:6px;
    align-items:center;font-size:11px;margin:2px 0}
  .sharename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sharenum{color:var(--dim);font-variant-numeric:tabular-nums}
  .sharepct{color:var(--faint);width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .ygrid{display:flex;gap:10px}
  .ygroup{flex:1;min-width:0}
  .ylabel{font-size:10px;color:var(--faint);text-align:center;margin-bottom:3px;
    cursor:help}
  /* Each group scales to its own leader: gold and science are different units,
     and a shared axis would flatten science to nothing. */
  .ybars{display:flex;gap:2px;align-items:flex-end;height:38px}
  .ybar{flex:1;display:flex;align-items:flex-end;height:100%;background:#161c24;
    border-radius:2px;overflow:hidden}
  .ybar i{display:block;width:100%;border-radius:2px;min-height:2px}
  /* Insights. A figure large enough to read at a glance and a sentence that
     stops it being read as more than it is. */
  .insight{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .insight:last-of-type{border-bottom:0}
  .ifig{flex:0 0 74px;font-size:17px;font-weight:600;line-height:1.15;
    color:var(--ink);font-variant-numeric:tabular-nums;padding-top:1px}
  .insight.good .ifig{color:#4ade80}
  .insight.warn .ifig{color:#fbbf24}
  .insight.bad .ifig{color:#f87171}
  .ibody{min-width:0}
  .ilabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--dim);margin-bottom:3px}
  .ibody p{margin:0;font-size:12px;line-height:1.5;color:var(--ink)}
  td .n{margin-left:6px;color:var(--faint);font-size:11px}
  td.hurt{color:#f87171;font-weight:600}
  .picker{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  button.who-btn{font-size:11px;padding:3px 7px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
  th,td{text-align:right;padding:3px 4px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td.name{width:44%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  thead th{color:var(--dim);font-weight:500;font-size:11px;border-bottom:1px solid var(--line)}
  thead th[title]{cursor:help;text-decoration:underline dotted var(--faint);
    text-underline-offset:3px}
  /* A tooltip we draw ourselves. The native `title` gives the help cursor and
     then, in this narrow panel, often nothing else - the browser wants a
     second of motionless hover and puts the bubble wherever it likes, which on
     a column header at the edge of the pane is frequently off-screen. If the
     column names need explaining at all, the explanation has to actually
     arrive. */
  /* Shown and hidden outright, with no fade. A tooltip that animates in is a
     tooltip that is briefly unreadable, and a half-opaque box over a table of
     numbers is worse than no box - the two sets of digits interleave. */
  #tip{position:fixed;z-index:50;max-width:280px;pointer-events:none;display:none;
    background:#0d1117;border:1px solid #33404f;border-radius:6px;
    padding:7px 9px;font-size:11px;line-height:1.45;color:var(--ink);
    box-shadow:0 6px 20px #000a}
  #tip.on{display:block}
  /* The view menu. Anchored to its button rather than to the header, so it
     stays put when the status text beside it grows a victory line. */
  .menu{position:relative}
  .caret{color:var(--faint)}
  #viewMenu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:210px;
    background:#0d1117;border:1px solid #33404f;border-radius:8px;padding:5px;
    box-shadow:0 10px 28px #000b}
  #viewMenu .group{font-size:9px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--faint);padding:6px 8px 3px}
  #viewMenu button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
    border:0;background:none;padding:6px 8px;border-radius:5px;font-size:12px}
  #viewMenu button:hover{background:#182028}
  #viewMenu button[aria-checked="true"]{background:#1b2836;color:#cfe0ff}
  /* A tick rather than a highlight alone, so the current view survives being
     read at a glance or in a screenshot. */
  #viewMenu button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:#4ade80}
  .civ{display:flex;align-items:center;gap:6px;min-width:0}
  .civ .dot{flex:0 0 auto}
  .civ>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The name keeps its line; tags wrap underneath it. Long tag text was
     squeezing "gpt-5.4-mini" into three wrapped lines. */
  .sigrow .who{flex-wrap:wrap;row-gap:4px}
  .sigrow .who > .dot{flex:none}
  .sigrow .tags{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dead{opacity:.4;text-decoration:line-through}
  .neg{color:#f87171}.pos{color:#4ade80}
  .card{background:#0f141b;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .card .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
  .card p{margin:2px 0;color:var(--dim)}.card p.plan{color:var(--ink)}
  .tick{color:var(--dim);padding:1px 0}.tick b{color:var(--ink);font-weight:500}
  .empty{color:var(--faint);font-style:italic}
  .msg{border-left:2px solid var(--line);padding:4px 0 4px 8px;margin-bottom:6px}
  .msg.private{border-left-color:#f472b6}
  .msg .meta{color:var(--faint);font-size:11px}
  tr.fogged td{color:var(--faint)}
  td.unseen{text-align:center;font-style:italic;color:var(--faint)}
  .card[data-civ]{cursor:pointer}
  .card[data-civ]:hover{border-color:#33404f}
  .card .meta{color:var(--faint);font-size:11px}
  .card p b{color:var(--dim);font-weight:600}
  /* Collapsed reasoning is clamped rather than hidden: enough to recognise the
     turn at a glance, not enough to bury the three panels underneath it. */
  .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #dossier .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px}
  #dossier p{margin:4px 0;color:var(--dim)}
  #dossier b{color:var(--ink);font-weight:600}
  #dossier ul{margin:2px 0 8px;padding-left:16px;color:var(--dim)}
  #dossier li{margin:2px 0}
  /* What changed since last turn. The dossier is mostly stable, so the edit is
     the signal and the rest is context. */
  .fresh{color:var(--ink)}
  #dossier li.fresh::marker{color:#4ade80}
  .edited{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#4ade80;
    border:1px solid #245c38;border-radius:3px;padding:1px 5px}
  /* Same green as `.edited`, deliberately: the outline on the picker and the
     word on the card are one fact, so they should not be two colours. */
  button.who-btn.wrote{border-color:#4ade80;color:#d5f5e0}
  button.who-btn.wrote::after{content:"";width:5px;height:5px;border-radius:50%;
    background:#4ade80;display:inline-block;margin-left:5px;vertical-align:middle}
  #dossier .card[data-doc]{cursor:pointer}
  #dossier .card[data-doc]:hover{border-color:#33404f}
  .trust{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
  .trust.high{color:#4ade80;border-color:#245c38}
  .trust.medium{color:#fbbf24;border-color:#5c4a24}
  .trust.low{color:#f87171;border-color:#5c2424}
  .threads{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  button.thread{font-size:11px;padding:3px 7px;display:inline-flex;align-items:center;gap:5px}
  button.thread .dot{width:8px;height:8px}
  button.thread .arrow{color:var(--faint)}
  button.thread[aria-pressed="true"] .arrow{color:#cfe0ff}
  /* Public and private have to be told apart at a glance; a border colour alone
     was doing all the work and none of it legibly. */
  .chan{font-size:9px;text-transform:uppercase;letter-spacing:.06em;border-radius:3px;
    padding:1px 4px;margin-right:4px;font-weight:600}
  .chan.private{color:#f472b6;border:1px solid #5c2444}
  .chan.public{color:#4ade80;border:1px solid #245c38}
  /* A proposal carries binding terms and a reply either signs them or does not,
     so those two get their own colours rather than reading as more chat. */
  .chan.proposal{color:#c084fc;border:1px solid #4a2a6b}
  .chan.reply.accept{color:#4ade80;border:1px solid #245c38}
  .chan.reply.reject{color:#f87171;border:1px solid #6b2626}
  /* A wordless act, said plainly. A blank line under a chip reads as a broken
     renderer; "signed without comment" reads as the choice it was. */
  .wordless{color:var(--faint);font-style:italic}
  /* A thread that moved this turn. The count alone does not say *when*, so
     finding the live conversation meant opening each tab in turn.
     Green, and loud about it - the blue ring read as another shade of the
     selected-tab blue and disappeared into it. This is the one colour in the
     panel that means "look here now", so it gets a full-strength border, a
     glow and a filled dot rather than a tint. */
  button.thread.live{border-color:#4ade80;box-shadow:0 0 0 1px #4ade8066,0 0 10px #4ade8033}
  button.thread.live::after{content:"";width:6px;height:6px;border-radius:50%;
    background:#4ade80;display:inline-block;margin-left:6px;vertical-align:middle;
    box-shadow:0 0 5px #4ade80}
  .msg .meta .dot{width:8px;height:8px;display:inline-block;vertical-align:middle;
    margin-right:3px}
  .msg{cursor:pointer}
  .msg.now{border-left-color:#2f6feb;background:#0f141b}
  /* The sender's private plan, shown beside what it actually said. Reading the
     two together is the whole reason the transcript is here. */
  .aside{margin-top:6px;padding:6px 8px;border-radius:4px;background:#161c25;
    color:var(--dim);font-size:12px}
  .aside b{color:#fbbf24;font-weight:600}
  /* A zero cache rate is worth noticing: it is the difference between paying
     1x and 0.1x for a prefix that never changes. */
  td.warn{color:#fbbf24}
  .pact{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#4ade80;
    border:1px solid #245c38;border-radius:3px;padding:1px 5px}
  .pact.lapsed{color:var(--faint);border-color:var(--line)}
</style>

<main>
  <div id="stage">
    <header>
      <!-- The title is the way into the library, which is where a visitor's
           hand goes anyway. Kept a button so it is reachable by keyboard and
           announces itself, rather than a heading with a click handler. -->
      <button id="libBtn" class="brand" aria-haspopup="dialog">ARENA-4X
        <span class="caret">▾</span></button>
      <!-- One menu for what you are looking at, and Play left outside it,
           because Play is the control you reach for repeatedly while the view
           is something you set and forget. -->
      <div class="menu">
        <button id="viewBtn" aria-haspopup="true" aria-expanded="false">
          <span id="viewNow">All empires</span> <span class="caret">▾</span></button>
        <div id="viewMenu" role="menu" hidden></div>
      </div>
      <button id="play">▶ Play</button>
      <span class="turn" id="status"></span>
    </header>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <div class="scrub">
    <button id="prev">‹</button>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/":"./vendor/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/OrbitControls.js";
import {
  HEIGHT, GROUND, CIV_COLOURS, WILD_COLOUR, HEX, axialToWorld,
  buildTerrain, buildScatter, buildResources, buildBorders, buildSettlements, buildPacts,
  buildNameplates,
  unitModel, baseGeometry, surfaceAtlas,
} from "./world.js";

const BASE = new URLSearchParams(location.search).get("match") || ".";
const CSS = ["var(--c0)", "var(--c1)", "var(--c2)", "var(--c3)"];
const UNIT_TYPES = ["settler","worker","scout","warrior","archer","spearman",
                    "swordsman","horseman","catapult","trireme","wolf","barbarian"];

const S = { match:null, frame:null, turn:1, mode:"god", focus:null, playing:null,
            index:null, expanded:null, dossiers:{}, dossiersBefore:{}, priorTrust:{},
            threads:null, thread:null, spend:{}, signals:{}, world:null,
            dossierOf:"all", combatOf:null };
const cache = new Map();
const $ = (id) => document.getElementById(id);
const civOf = (id) => S.match.civs.find((c) => c.player_id === id);
const cssOf = (id) => (civOf(id) ? CSS[civOf(id).colour % 4] : "#9aa0aa");
const hexOf = (id) => (civOf(id) ? CIV_COLOURS[civOf(id).colour % 4] : WILD_COLOUR);
// The model is the label. The civ name is fiction the agents were given; the
// match is a comparison between models, so that is what a reader needs to see.
// Both are kept - the civ name is what the agents call each other in their own
// messages, so hiding it entirely would make the diplomacy feed incoherent.
const nameOf = (id) => (civOf(id) ? (civOf(id).model || civOf(id).civ_name) : "Wilderness");
const civNameOf = (id) => (civOf(id) ? civOf(id).civ_name : "Wilderness");
const esc = (s) => String(s).replace(/[<>&]/g,(c)=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

// --- scene -----------------------------------------------------------------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;  // PCFSoft is deprecated in r185
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
scene.fog = new THREE.Fog(0x0b0f14, 46, 96);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// Clamped below the horizon: dropping under the terrain would show the world
// from beneath and read as a bug rather than a viewpoint.
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 6;
controls.maxDistance = 220;
// Zoom towards whatever is under the pointer, not towards the orbit target.
// On a board this wide the difference is most of the usability: centre-zooming
// means picking a corner of the map, zooming in on the middle, then panning
// back out to where you were looking - every time. With this, pointing at a
// city and scrolling arrives at that city.
controls.zoomToCursor = true;

scene.add(new THREE.HemisphereLight(0xbcd7ff, 0x2b2418, 1.5));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.1);
sun.position.set(24, 34, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:120 });
scene.add(sun);

const staticLayer = new THREE.Group();   // terrain, scatter - built once
const dynamicLayer = new THREE.Group();  // units, cities, borders - per turn
const pointerLayer = new THREE.Group();  // the hover marker, never rebuilt
scene.add(staticLayer, dynamicLayer, pointerLayer);

/**
 * The marker that answers "which tile is it talking about".
 *
 * Agents write in coordinates - "move settler u64 to (-8,0)" - which is precise
 * and unreadable: finding (-8,0) on a 1027-tile hex board by eye takes longer
 * than reading the sentence. So the sentence points at the board instead.
 *
 * A ring on the tile *and* an arrow above it. The ring alone is easy to lose
 * against terrain at low zoom; the arrow is visible from any angle and reads as
 * deixis rather than decoration. Built once and moved, rather than rebuilt per
 * hover, because hovering a paragraph fires this dozens of times a second.
 */
const marker = (() => {
  const group = new THREE.Group();
  // `fog: false` matters more than it looks. Scene fog is tuned to make distant
  // terrain recede, and a marker that recedes with it is useless at exactly the
  // moment you need it - pointing at something far from the camera.
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(HEX * 0.72, HEX * 1.08, 6),
    new THREE.MeshBasicMaterial({
      color: 0xffd166, transparent: true, opacity: 0.95,
      side: THREE.DoubleSide, depthTest: false, fog: false,
    })
  );
  ring.rotation.x = -Math.PI / 2;
  // Flat-topped to match the tiles, which are drawn without rotation.
  ring.rotation.z = Math.PI / 6;
  ring.renderOrder = 20;
  // Sized to be findable from across the board. The ring alone was correct and
  // nearly invisible at default zoom, which is the only zoom most people use.
  const arrow = new THREE.Mesh(
    new THREE.ConeGeometry(HEX * 0.42, HEX * 1.1, 6),
    new THREE.MeshBasicMaterial({ color: 0xffd166, depthTest: false, fog: false })
  );
  arrow.rotation.x = Math.PI;   // point down at the tile
  arrow.renderOrder = 20;
  group.add(ring, arrow);
  group.visible = false;
  group.renderOrder = 20;
  pointerLayer.add(group);
  return { group, arrow };
})();

let markerBob = 0;

function pointAt(tileIndex) {
  if (tileIndex == null || !S.match) return clearPointer();
  const key = S.match.tiles[tileIndex];
  if (key === undefined) return clearPointer();
  const [q, r] = key.split(",").map(Number);
  const [x, , z] = axialToWorld(q, r);
  const y = topOf(tileIndex);
  marker.group.position.set(x, y + 0.02, z);
  marker.arrow.position.y = 1.6;
  marker.group.visible = true;
}

function clearPointer() {
  marker.group.visible = false;
}

/** Tile index for a `"q,r"` key, or null if it is off the map. */
function tileAt(key) {
  const i = S.tileIndex?.get(key);
  return i === undefined ? null : i;
}


function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

(function loop() {
  requestAnimationFrame(loop);
  if (marker.group.visible) {
    markerBob += 0.09;
    marker.arrow.position.y = 1.6 + Math.sin(markerBob) * 0.16;
  }
  controls.update();
  renderer.render(scene, camera);
})();

// --- data ------------------------------------------------------------------
async function loadFrame(turn) {
  if (cache.has(turn)) return cache.get(turn);
  // `no-store`, because two different matches serve entirely different content
  // at identical URLs. Point the viewer at a second bundle on the same port and
  // the browser answers `turns/0011.json` out of cache from the *first* one -
  // so the board, the threads and the cost table all describe a match you are
  // not looking at, with nothing on screen to say so. Costs nothing here: the
  // frames are cached in `cache` for the session anyway.
  const res = await fetch(`${BASE}/turns/${String(turn).padStart(4,"0")}.json`, {cache: "no-store"});
  const frame = await res.json();
  cache.set(turn, frame);
  return frame;
}

/**
 * Everything that is a running total rather than a per-turn fact.
 *
 * Borders are written as deltas, and "has this civ ever seen this tile" is by
 * definition cumulative, so both are folded forward from turn 1. Frames are
 * cached, so this is a loop over memory rather than a refetch.
 */
/**
 * Every message of the match, gathered once.
 *
 * The diplomacy panel used to show only the current turn, which made it a
 * ticker rather than a record: thirteen messages spread over thirty turns meant
 * twenty-seven turns of "Nothing said this turn" and no way to read the
 * negotiation that actually happened. A conversation is the unit here, not a
 * frame.
 */
async function allMessages() {
  if (S.threads) return S.threads;
  const messages = [];
  for (let t = 1; t <= S.match.turns; t++) {
    for (const m of (await loadFrame(t)).messages || []) messages.push({ ...m, turn: t });
  }
  // Keyed by unordered pair, because a thread is a relationship rather than a
  // direction - reading one side of a negotiation tells you very little.
  const threads = new Map([["public", []]]);
  for (const m of messages) {
    const key = m.channel === "public" ? "public" : [m.from, m.to].sort().join("|");
    if (!threads.has(key)) threads.set(key, []);
    threads.get(key).push(m);
  }
  S.threads = threads;
  return threads;
}

async function foldTo(turn) {
  const owners = new Array(S.match.terrain.length).fill(null);
  const explored = new Map(S.match.civs.map((c) => [c.player_id, new Set()]));
  // Dossiers are written as deltas, so the current one is the fold and the
  // previous one is the fold stopped a turn short. Keeping both is what lets
  // the panel show the *edit* rather than just the text.
  let dossiers = {};
  let before = {};
  const spend = {};
  // Cumulative signals. Everything here is derived from what the bundle already
  // carries - no new engine data - and folded forward like everything else, so
  // the panel reads "as of turn N" rather than "for the whole match".
  const signals = {};
  const sig = (pid) => (signals[pid] ??= {
    said: 0, dm: 0, lostToWild: 0, sacked: 0, met: new Set(),
    fights: 0, kills: 0, losses: 0, wildFights: 0, log: [],
    lessons: 0, commitments: 0, rivalsModelled: 0, notes: 0,
  });
  // The last view each agent expressed about each rival, whenever it expressed
  // it. Not the same as "what its dossier said last turn": agents rewrite the
  // whole dossier rather than editing it, so an opponent model can vanish for
  // several turns and come back revised. Diffing only against the previous turn
  // missed every one of those - which is most of them.
  const priorTrust = {};
  // Match-wide tallies, as opposed to the per-civ ones above. Kept separate
  // rather than summed out of `signals` at render time because combat is
  // recorded against both participants there - summing it would report every
  // fight twice and quietly double the one number the Insights panel leans on
  // hardest.
  const world = {
    pub: 0, priv: 0, rivalFights: 0, wildFights: 0,
    proposals: {}, signed: 0, wars: [], gone: [], firstContact: null,
  };
  for (let t = 1; t <= turn; t++) {
    const f = await loadFrame(t);
    for (const [i, who] of Object.entries(f.owners || {})) owners[+i] = who;
    for (const [pid, tiles] of Object.entries(f.visibility || {})) {
      const seen = explored.get(pid);
      if (seen) for (const i of tiles) seen.add(i);
    }
    if (t < turn) {
      for (const [pid, doc] of Object.entries(f.dossiers || {})) {
        for (const m of doc.opponent_models || []) {
          (priorTrust[pid] ??= {})[m.player_id] = m.trustworthiness;
        }
      }
    }
    // `messages` carries three kinds: what a civ chose to say, and the notes
    // attached to proposals and replies. Counting all three as "talk" inflated
    // every seat's private total by its treaty paperwork - 585 against a real
    // 481 in the first complete match - and made a civ that negotiated a lot
    // look like a civ that talked a lot. The proposals are counted separately,
    // where they mean something.
    for (const m of f.messages || []) {
      const row = sig(m.from);
      if (m.kind && m.kind !== "message") { row.notes += 1; continue; }
      row.said += 1;
      if (m.channel === "private") { row.dm += 1; world.priv += 1; } else world.pub += 1;
    }
    for (const e of f.events || []) {
      if (!e.actor) continue;
      const row = sig(e.actor);
      // "lost to the wilderness" is how the engine phrases a kill by the
      // neutral faction. Attribution is on the *victim*, which is what makes
      // this answer the question worth asking: who is being bled by the map.
      if (e.type === "unit_killed" && e.text.includes("wilderness")) row.lostToWild += 1;
      if (e.type === "city_sacked") row.sacked += 1;

      // Proposals and treaties are carried as prose, not structure, so they
      // are read the same way `first_contact` is. The type is the interesting
      // half: four kinds are on offer and a match that only ever uses one is
      // saying something about all four models at once.
      if (e.type === "proposal_made") {
        const kind = /proposed (\w+)/.exec(e.text)?.[1] || "unknown";
        world.proposals[kind] = (world.proposals[kind] || 0) + 1;
      }
      if (e.type === "treaty_signed") world.signed += 1;
      if (e.type === "war_declared") world.wars.push({ turn: t, text: e.text });
      if (e.type === "player_eliminated") world.gone.push({ turn: t, who: e.actor });

      if (e.type === "first_contact") {
        if (world.firstContact == null) world.firstContact = t;
        const other = S.match.civs.find((c) => e.text.includes(c.civ_name) && c.player_id !== e.actor);
        if (other) row.met.add(other.player_id);
      }
    }
    // Combat, from both sides. A fight is recorded against attacker and
    // defender alike, because "who is being worn down" is the question, and a
    // civ that is only ever attacked never appears in a list keyed by actor.
    // Fights the wilderness started. Bundles built before the engine learned to
    // report them carry only the fights a *civ* chose to start, which in the
    // first complete match was 28 of 103 blows - so a panel reading `combat`
    // alone reported a quarter of the violence in the world and said nothing
    // about the rest. The events always carried it, so they are the fallback,
    // and a bundle that already has wilderness attacks in `combat` skips it
    // rather than counting them twice.
    const anyWild = (f.combat || []).some(
      (c) => c.attacker && !S.match.civs.some((x) => x.player_id === c.attacker));
    if (!anyWild) {
      for (const e of f.events || []) {
        if (e.type !== "combat_resolved") continue;
        if (e.actor && !S.match.civs.some((x) => x.player_id === e.actor)) world.wildFights += 1;
      }
    }
    for (const c of f.combat || []) {
      const wild = (pid) => pid && !S.match.civs.some((x) => x.player_id === pid);
      for (const [me, them, iDied, theyDied] of [
        [c.attacker, c.defender, c.attacker_died, c.defender_died],
        [c.defender, c.attacker, c.defender_died, c.attacker_died],
      ]) {
        if (wild(me) || !me) continue;
        // Counted once per fight, from the attacker's side only.
        if (me === c.attacker) (wild(them) ? world.wildFights++ : world.rivalFights++);
        const row = sig(me);
        row.fights += 1;
        if (wild(them)) row.wildFights += 1;
        if (iDied) row.losses += 1;
        if (theyDied) row.kills += 1;
        row.log.push({ turn: t, ...c, mine: me });
      }
    }
    for (const [pid, row] of Object.entries(f.spend || {})) {
      const acc = (spend[pid] ??= { usd: 0, input: 0, output: 0, cached: 0, ms: 0, turns: 0 });
      for (const k of ["usd", "input", "output", "cached", "ms"]) acc[k] += row[k] || 0;
      acc.turns += 1;
      // Effort is a per-turn fact, not a running total, so it is carried rather
      // than summed - and the previous turn's value is kept beside it, because
      // the interesting thing is not what a seat is thinking at but the turn it
      // decided to change.
      if (row.effort != null) {
        acc.effortBefore = acc.effort ?? null;
        acc.effort = row.effort;
        acc.effortSent = row.effort_sent || row.effort;
        (acc.efforts ??= new Set()).add(row.effort);
      }
      // Output tokens per turn, kept as a series. The *declared* dial is one of
      // three words and, on a fixed-effort match, never moves - so charting its
      // variation would draw four flat lines and call it a finding. What
      // actually varies is how much each model spends thinking, turn to turn,
      // and that varies enormously: measured across seats, a factor of thirty.
      (acc.perTurn ??= []).push(row.output || 0);
    }
    before = dossiers;
    dossiers = { ...dossiers, ...(f.dossiers || {}) };
    // What each civ is carrying in its own memory, as of this turn. A count
    // rather than the text, because the question the panel answers is "is this
    // one learning anything" - a civ at nine lessons and one at zero are
    // playing differently, and that is visible long before the text is read.
    for (const [pid, d] of Object.entries(dossiers)) {
      const row = sig(pid);
      row.lessons = (d.lessons || []).length;
      row.commitments = (d.standing_commitments || []).length;
      row.rivalsModelled = (d.opponent_models || []).length;
    }
  }
  return { owners, explored, dossiers, before, priorTrust, spend, signals, world };
}

// --- rendering -------------------------------------------------------------
// Recursive, because the border layer is a group of one mesh per civ and
// popping it without walking into it would leak a geometry on every turn step.
const clear = (group) => {
  while (group.children.length) {
    group.children.pop().traverse((o) => {
      o.geometry?.dispose?.();
      o.material?.dispose?.();
    });
  }
};

const M = new THREE.Matrix4();
const C = new THREE.Color();

function topOf(index) {
  return HEIGHT[S.match.terrain[index]] ?? 0.36;
}

function instanced(geo, count, opts = {}) {
  const mesh = new THREE.InstancedMesh(
    geo,
    new THREE.MeshLambertMaterial({ flatShading: true, ...opts }),
    count
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/**
 * Fog of war, in the three states Freeciv uses: currently in sight, seen
 * before and remembered, and never visited.
 *
 * Applied to the terrain rather than only to the units on it. Hiding the units
 * but leaving the ground fully lit was the weak part of the agent view, because
 * the whole point of that view is seeing what a model could *not* see when it
 * made a bad call - and unexplored ground is most of what it could not see.
 */
function applyFog(lit, explored) {
  const shade = !lit
    ? () => 1
    : (i) => (lit.has(i) ? 1 : explored?.has(i) ? 0.5 : 0.13);
  for (const layer of staticLayer.children) layer.userData.paint?.(shade);
}

async function drawTurn() {
  const f = S.frame;
  clear(dynamicLayer);

  const lit = S.mode === "agent" && S.focus ? new Set(f.visibility[S.focus] || []) : null;
  const { owners, explored, dossiers, before, priorTrust, spend, signals, world } = await foldTo(S.turn);
  S.spend = spend;
  S.signals = signals;
  S.world = world;
  S.dossiers = dossiers;
  S.dossiersBefore = before;
  S.priorTrust = priorTrust;
  const known = S.focus ? explored.get(S.focus) : null;
  applyFog(lit, known);
  const at = (i) => {
    const [q, r] = S.match.tiles[i].split(",").map(Number);
    return axialToWorld(q, r);
  };

  // Territory: a coloured line along the *edge* of the claim. See buildBorders
  // for why this replaced a tint over the whole tile.
  //
  // Drawn on explored ground rather than only on what is currently in sight, so
  // an empire keeps its shape in the agent view. That does show the *current*
  // owner of a fogged tile rather than the last one this civ actually saw; the
  // bundle carries no per-civ memory of ownership, and the alternative - border
  // lines that blink out the moment a scout walks away - was worse.
  dynamicLayer.add(buildBorders(
    S.match.tiles, owners, topOf, hexOf, lit ? (i) => known?.has(i) : null
  ));

  // Towns: plaza, buildings, a curtain wall if built, a keep for a temple or
  // wonder. Walls take their own baked colours; only the roofs carry the civ.
  const cities = f.cities.filter((c) => !lit || lit.has(c.at));
  dynamicLayer.add(buildSettlements(cities, (tile) => {
    const [x, , z] = at(tile);
    return [x, topOf(tile), z];
  }, hexOf));

  // Who each colour *is*, said on the board rather than only in the panels.
  // Fog applies for free: `cities` is already filtered to what this seat can
  // see, so in agent mode a rival's nameplate appears when you find their town
  // and not before - which is the same rule the borders and units follow.
  dynamicLayer.add(buildNameplates(cities, nameOf, (tile) => {
    const [x, , z] = at(tile);
    return [x, topOf(tile), z];
  }, hexOf));

  // Who is bound to whom, as of this turn. A live pact or an alliance both
  // count; a lapsed pact does not, because a promise that has expired is not a
  // fact about the board any more.
  //
  // Fog applies. In agent mode a civ sees only the treaties it is party to -
  // knowing that two rivals have secretly agreed not to fight each other is
  // exactly the sort of thing an agent has to *earn*, and handing it over on
  // the board would quietly answer the question the replay exists to ask.
  const bonds = new Map();
  for (const [pair, v] of Object.entries(f.relations || {})) {
    const live = v.state === "alliance" || (v.pact_until && v.pact_until >= S.turn);
    if (!live) continue;
    const [a, b] = pair.split("|");
    if (S.mode === "agent" && S.focus && a !== S.focus && b !== S.focus) continue;
    const kind = v.state === "alliance" ? "alliance" : "pact";
    for (const [self, other] of [[a, b], [b, a]]) {
      if (!bonds.has(self)) bonds.set(self, []);
      bonds.get(self).push({ who: other, kind });
    }
  }
  dynamicLayer.add(buildPacts(S.match.tiles, owners, bonds, (tile) => {
    const [x, , z] = at(tile);
    return [x, topOf(tile), z];
  }, hexOf));

  // Units, one instanced mesh per type plus a shared ownership ring.
  const visible = f.units.filter((u) => !lit || lit.has(u.at));
  const bases = instanced(baseGeometry(), visible.length, { transparent: true, opacity: 0.9 });
  visible.forEach((u, n) => {
    const [x, , z] = at(u.at);
    M.makeScale(1, 1, 1).setPosition(x, topOf(u.at) + 0.02, z);
    bases.setMatrixAt(n, M);
    bases.setColorAt(n, C.setHex(hexOf(u.owner)));
  });
  bases.instanceMatrix.needsUpdate = true;
  bases.castShadow = false;
  dynamicLayer.add(bases);

  // Two meshes per unit type. `body` carries baked vertex colours - skin,
  // leather, wood, steel - and is never tinted, because instance colour
  // multiplies the whole mesh and tinting a soldier by his civ colour used to
  // tint his skin and his sword blade with it. `livery` is the tunics, shields
  // and sails, and is the only part that takes the civ colour.
  for (const type of UNIT_TYPES) {
    const of = visible.filter((u) => u.type === type);
    if (!of.length) continue;
    const model = unitModel(type);
    for (const [geo, civ] of [[model.body, false], [model.livery, true]]) {
      if (!geo) continue;
      const mesh = instanced(geo, of.length, {
        map: surfaceAtlas(), vertexColors: !civ,
      });
      of.forEach((u, n) => {
        const [x, , z] = at(u.at);
        // Face the board centre, so armies read as oriented rather than scattered.
        M.makeRotationY(Math.atan2(-x, -z))
          .setPosition(x, topOf(u.at) + (u.embarked ? -0.06 : 0.01), z);
        mesh.setMatrixAt(n, M);
        // Wounded units darken, so a battered stack is visible without a UI
        // probe. On the body that multiplies the baked colours; on the livery
        // it darkens the civ colour.
        C.setHex(civ ? hexOf(u.owner) : 0xffffff);
        mesh.setColorAt(n, C.lerp(new THREE.Color(0x2a1216), (100 - u.hp) / 220));
      });
      mesh.instanceMatrix.needsUpdate = true;
      dynamicLayer.add(mesh);
    }
  }
}

// --- panels ----------------------------------------------------------------
/**
 * What the focused civ is entitled to know about a rival this turn.
 *
 * The board has always respected the fog; this panel did not. In agent mode it
 * printed every rival's exact gold, food and score straight from the bundle's
 * god-truth economy - in the one view whose entire purpose is showing what a
 * civ could see when it made its decisions. Reading a bad call next to numbers
 * the agent never had is worse than not showing the panel at all.
 *
 * `contact` is directed and per-turn: `contact[observer]` lists the rivals that
 * observer can currently see. Score is revealed on contact and hidden again
 * when it lapses, which is what the engine's own intel view does.
 */
function knows(playerId) {
  if (S.mode !== "agent" || !S.focus || playerId === S.focus) return true;
  return (S.frame.contact?.[S.focus] || []).includes(playerId);
}

function dossierPick(ev) {
  const b = ev.target.closest(".who-btn");
  if (b) {
    S.dossierOf = b.dataset.who;
    S.dossierOpen = null;
    panels();
    return;
  }
  // A card in the "all" view opens to its full text. Checked after the picker
  // because the picker sits inside the same container.
  const card = ev.target.closest(".card[data-doc]");
  if (!card) return;
  S.dossierOpen = S.dossierOpen === card.dataset.doc ? null : card.dataset.doc;
  panels();
}

/**
 * How hard a seat was told to think this turn, and whether that just changed.
 *
 * Nothing recorded this until now, which is why one seat played every match of
 * this project with reasoning off while the seat beside it was set to `high` -
 * the artifacts simply could not answer "were all four asked the same question".
 * Under fixed effort this column is the proof of parity. Under self-selected
 * effort it stops being configuration and becomes a move, and the turn a model
 * decides to think harder is then one of the more interesting events in a match.
 */
/**
 * Who is closest to ending the match by science.
 *
 * Worth its own meter because the science victory is the one that arrives
 * without warning. A conquest builds visibly - armies move, cities change hands
 * - while a research win is a number nobody was watching until the match stops.
 * One did exactly that on turn 128 while the other three were signing pacts.
 *
 * `apex_tech` marks the point of no return: that civ needs only to build the
 * project. Older bundles predate these fields, so the meter falls back to a
 * plain tech count and says which it is showing rather than inventing certainty.
 */
/**
 * How steadily each model thinks.
 *
 * Two different questions live here and only one has an interesting answer
 * right now. The *declared* effort is a match-level setting - every seat is
 * told `medium` - so its variation is zero by construction, and the panel says
 * so rather than drawing four flat lines and implying a result.
 *
 * The measured question is how much each model actually spends per turn, and
 * that swings hard: a seat may cruise for twenty turns and then think five
 * times as long about a war. The bar is the spread - each seat's own
 * turn-to-turn variation as a share of its median - so a steady seat reads
 * short and a lurching one reads long, independent of whether it is an
 * expensive model or a cheap one.
 */
function effortVariation(rows) {
  const stats = rows.map(({ c, s }) => {
    const series = (s.perTurn || []).filter((n) => n > 0);
    if (series.length < 3) return null;
    const sorted = [...series].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)] || 1;
    const mean = series.reduce((a, b) => a + b, 0) / series.length;
    const sd = Math.sqrt(series.reduce((a, b) => a + (b - mean) ** 2, 0) / series.length);
    return { c, cv: sd / Math.max(median, 1), median, peak: Math.max(...series) };
  }).filter(Boolean);
  if (!stats.length) return "";

  const dials = new Set(rows.flatMap(({ s }) => [...(s.efforts || [])]));
  const worst = Math.max(...stats.map((r) => r.cv)) || 1;
  return `<div class="race">
    <div class="racehead">thinking, turn to turn
      <span class="meta" title="Each bar is that model's own variation in output
        tokens per turn, relative to its own median - so it compares steadiness,
        not size. A long bar means a model that sometimes thinks far harder than
        usual; a short one means it spends about the same every turn.">${
        dials.size > 1 ? "effort dial moved during this match" :
        `declared effort fixed at ${[...dials][0] || "medium"} - this is measured spend`}</span></div>
    ${[...stats].sort((a, b) => b.cv - a.cv).map((r) => `
      <div class="racerow" title="median ${Math.round(r.median).toLocaleString()} output
        tokens a turn, peak ${Math.round(r.peak).toLocaleString()}">
        <span class="dot" style="background:${CSS[r.c.colour]}"></span>
        <span class="racename">${esc(r.c.model || r.c.civ_name)}</span>
        <span class="bars"><i style="width:${Math.round(100 * r.cv / worst)}%;
          background:${CSS[r.c.colour]}"></i></span>
        <span class="racenote">${r.cv.toFixed(2)}x</span></div>`).join("")}
  </div>`;
}

function scienceRace(rows) {
  const known = rows.map(({ c, e }) => ({
    c,
    techs: e.techs || 0,
    apex: e.apex_tech === true,
    built: e.apex_built === true,
    exact: e.apex_tech !== undefined,
  }));
  const most = Math.max(1, ...known.map((r) => r.techs));
  const exact = known.some((r) => r.exact);
  const ranked = [...known].sort(
    (a, b) => b.built - a.built || b.apex - a.apex || b.techs - a.techs
  );
  return `<div class="race">
    <div class="racehead">science race
      <span class="meta" title="How close each civ is to researching apex_theory and
        building the apex_project. Completing it ends the match immediately and
        everyone else loses, however many cities they hold.">${
        exact ? "to the apex project" : "by techs known (older match)"}</span></div>
    ${ranked.map((r) => {
      const pct = r.built ? 100 : Math.round(100 * r.techs / most);
      const note = r.built ? "BUILT - match over"
        : r.apex ? "has apex_theory - one build away" : `${r.techs} techs`;
      return `<div class="racerow" title="${esc(note)}">
        <span class="dot" style="background:${CSS[r.c.colour]}"></span>
        <span class="racename">${esc(r.c.model || r.c.civ_name)}</span>
        <span class="bars"><i style="width:${pct}%;background:${CSS[r.c.colour]}"></i></span>
        <span class="racenote ${r.apex || r.built ? "close" : ""}">${esc(note)}</span></div>`;
    }).join("")}
  </div>`;
}

/**
 * For each pair at war, which way it is going.
 *
 * A single bar split between two civ colours, leaning toward whoever holds more
 * military strength. Strength rather than headcount - ten warriors and ten
 * swordsmen are the same number and not the same army - falling back to unit
 * count on bundles written before `power` existed.
 *
 * Only pairs actually at war. A slider between civs at peace would be a
 * comparison, not a front, and the panel already has those.
 */
function warFronts(rows) {
  const by = Object.fromEntries(rows.map(({ c, e }) => [c.player_id, { c, e }]));
  const fronts = Object.entries(S.frame.relations || {})
    .filter(([, v]) => v.state === "war")
    .map(([pair]) => pair.split("|"))
    .filter(([a, b]) => by[a] && by[b]);
  if (!fronts.length) return "";

  const strength = (side) => side.e.power ?? (side.e.military || 0);
  return `<div class="race">
    <div class="racehead">wars
      <span class="meta" title="Each bar is one war, split by military strength -
        attack plus defence across every non-civilian unit. The bar leans toward
        whoever is currently stronger. It measures the balance of force, not who
        is winning the war on the map.">balance of force</span></div>
    ${fronts.map(([a, b]) => {
      const left = by[a], right = by[b];
      const la = Math.max(0, strength(left)), lb = Math.max(0, strength(right));
      const total = Math.max(1, la + lb);
      const pct = Math.round(100 * la / total);
      return `<div class="front">
        <span class="dot" style="background:${CSS[left.c.colour]}"></span>
        <span class="frontname">${esc(left.c.model || left.c.civ_name)}</span>
        <span class="slider" title="${la} vs ${lb} strength">
          <i style="width:${pct}%;background:${CSS[left.c.colour]}"></i>
          <i style="width:${100 - pct}%;background:${CSS[right.c.colour]}"></i>
          <b style="left:${pct}%"></b></span>
        <span class="frontname right">${esc(right.c.model || right.c.civ_name)}</span>
        <span class="dot" style="background:${CSS[right.c.colour]}"></span></div>`;
    }).join("")}
  </div>`;
}

/**
 * A donut of shares, drawn as inline SVG.
 *
 * No chart library: the artifact has to be self-contained and open offline, so
 * a CDN script is not an option and 40 lines of arc maths is cheaper than
 * vendoring one. A donut rather than a pie because the hole gives the total
 * somewhere to live, and the total is half the point - "$5.18 across four
 * seats" and "one seat is 58% of it" are the two facts together.
 *
 * Slices under 2% still get drawn. A seat spending almost nothing is exactly
 * the comparison worth seeing, and rounding it away would flatter it.
 */
function donut(slices, { size = 108, label = "", centre = null } = {}) {
  const total = slices.reduce((a, s) => a + Math.max(0, s.value), 0);
  if (total <= 0) return "";
  const r = size / 2 - 2;
  const inner = r * 0.58;
  let angle = -Math.PI / 2;
  const arcs = slices.map((s) => {
    const frac = Math.max(0, s.value) / total;
    // A single slice would produce a zero-length arc and vanish, so a full
    // circle is drawn as two half arcs.
    const sweep = frac >= 1 ? Math.PI * 1.999 : frac * Math.PI * 2;
    const from = angle;
    const to = (angle += sweep);
    const big = sweep > Math.PI ? 1 : 0;
    const pt = (rad, a) => `${(size / 2 + rad * Math.cos(a)).toFixed(2)} ${(size / 2 + rad * Math.sin(a)).toFixed(2)}`;
    const d = `M ${pt(r, from)} A ${r} ${r} 0 ${big} 1 ${pt(r, to)}`
      + ` L ${pt(inner, to)} A ${inner} ${inner} 0 ${big} 0 ${pt(inner, from)} Z`;
    return `<path d="${d}" fill="${s.colour}" opacity="0.92"
      title="${esc(s.name)} ${Math.round(frac * 100)}%"></path>`;
  }).join("");
  const middle = centre
    ? `<text x="${size / 2}" y="${size / 2}" class="dtotal">${esc(centre(total))}</text>`
    : "";
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"
    role="img" aria-label="${esc(label)}">${arcs}${middle}</svg>`;
}

/** Legend rows beside a donut: colour, name, value, share. */
function shares(slices, fmt) {
  const total = slices.reduce((a, s) => a + Math.max(0, s.value), 0) || 1;
  return [...slices].sort((a, b) => b.value - a.value).map((s) => `
    <div class="sharerow">
      <span class="dot" style="background:${s.colour}"></span>
      <span class="sharename">${esc(s.name)}</span>
      <span class="sharenum">${fmt(s.value)}</span>
      <span class="sharepct">${Math.round(100 * Math.max(0, s.value) / total)}%</span>
    </div>`).join("");
}

/**
 * Grouped bars, one group per yield, one bar per civ.
 *
 * Grouped rather than a donut per yield, because the question is "who leads
 * each of these", and four donuts side by side answers it four times without
 * ever putting the civs next to each other. Each group scales to its own
 * leader - gold and science are different units and a shared axis would make
 * science invisible.
 */
function yieldBars(rows, metrics) {
  return metrics.map(({ key, label, hint }) => {
    const peak = Math.max(1, ...rows.map(({ e }) => Math.max(0, e[key] || 0)));
    return `<div class="ygroup">
      <div class="ylabel" title="${esc(hint)}">${label}</div>
      <div class="ybars">${rows.map(({ c, e }) => {
        const v = Math.max(0, e[key] || 0);
        return `<span class="ybar" title="${esc(c.model || c.civ_name)}: ${v}">
          <i style="height:${Math.round(100 * v / peak)}%;background:${CSS[c.colour]}"></i></span>`;
      }).join("")}</div>
    </div>`;
  }).join("");
}

const SHORT_EFFORT = { minimal: "min", low: "low", medium: "med", high: "high" };

function effortCell(s) {
  if (!s.effort) return `<td class="meta">—</td>`;
  // A change is marked, not merely implied by the value differing from a row you
  // would have to scroll back to. `effortBefore` is null on a seat's first turn,
  // which is not a change - it is the start.
  const moved = s.effortBefore != null && s.effortBefore !== s.effort;
  const detail = s.effortSent && s.effortSent !== s.effort
    ? `${esc(s.effort)} — sent as ${esc(s.effortSent)}` : esc(s.effort);
  return `<td title="${moved ? `changed from ${esc(s.effortBefore)}. ` : ""}${detail}"
    class="${moved ? "moved" : ""}">${esc(SHORT_EFFORT[s.effort] || s.effort)}${
    moved ? `<span class="arrow-up">▲</span>` : ""}</td>`;
}

/** The count beside a collapsed section heading. */
function badge(id, value, hot = false) {
  const el = $(`n-${id}`);
  if (!el) return;
  el.textContent = value ? String(value) : "";
  el.className = hot ? "hot" : "";
}

/**
 * Insights: the handful of things about this match that are worth saying out
 * loud, stated as of the turn you are looking at.
 *
 * Every other panel answers "what is true right now". This one answers "what is
 * strange about what has happened so far", which is a different job and the one
 * the whole experiment exists for. The findings that survived the first
 * complete match were all of this shape - not a number anybody asked for, but a
 * ratio that turned out lopsided: six times more violence against wolves than
 * against each other, seven private messages for every public one, fifty-two
 * treaties that were all the same treaty.
 *
 * Two rules, both learned the hard way elsewhere in this project:
 *
 * A card only appears when the evidence for it exists. An insight computed from
 * three data points is a coin toss wearing a headline, and the panel would be
 * at its most confident on turn 2 when it knows almost nothing.
 *
 * A card states what happened, not what it means about a model. "They have not
 * declared war" is an observation. "They are peaceful" is a claim about four
 * language models that this bundle cannot support, and the difference matters
 * more here than anywhere else in the viewer.
 */
function insights() {
  const w = S.world;
  if (!w) return `<div class="empty">Nothing to read yet.</div>`;
  const cards = [];
  const turn = S.turn;

  // --- how long they went without declaring war ----------------------------
  if (turn >= 10) {
    const first = w.wars[0];
    const quiet = first ? first.turn - 1 : turn;
    const pct = Math.round(100 * quiet / turn);
    cards.push(card(
      first ? `turn ${first.turn}` : `${turn} turns`,
      first ? "first declaration of war" : "and nobody has declared war",
      first
        ? `${quiet} turns passed before the first declaration - ${pct}% of the match
           to this point. ${esc(first.text)}.`
        : `Every civ can declare war on any turn at no cost, and none has.
           Whether that is caution, an oversight, or a read of the odds is the
           question; the fact is just that the option has gone unused.`,
      first ? "" : "good"));
  }

  // --- who they actually fight ---------------------------------------------
  const fights = w.rivalFights + w.wildFights;
  if (fights >= 8) {
    const ratio = w.rivalFights ? (w.wildFights / w.rivalFights) : Infinity;
    cards.push(card(
      w.rivalFights ? `${ratio.toFixed(1)}x` : `${w.wildFights}-0`,
      "more fighting with the map than each other",
      `${w.wildFights} fights involved wolves or barbarians, ${w.rivalFights}
       were civ against civ. The wilderness is neutral and attacks everyone, so
       it is the one opponent nobody has to choose - which makes the other
       number the interesting one.`));
  }

  // --- public voice against private voice ----------------------------------
  const talk = w.pub + w.priv;
  if (talk >= 20) {
    const ratio = w.pub ? (w.priv / w.pub) : Infinity;
    cards.push(card(
      w.pub ? `${ratio.toFixed(1)} : 1` : `${w.priv} : 0`,
      "private messages for every public one",
      `${w.priv} direct messages against ${w.pub} broadcasts. Both cost the same
       and reach different audiences, so the split is a choice. Whether the two
       voices say the same thing is answerable in the Diplomacy panel, one
       thread at a time.`));
  }

  // --- what they ask each other for ----------------------------------------
  const kinds = Object.entries(w.proposals).sort((a, b) => b[1] - a[1]);
  const made = kinds.reduce((a, [, n]) => a + n, 0);
  if (made >= 5) {
    const [top, topN] = kinds[0];
    const only = kinds.length === 1;
    const rate = made ? Math.round(100 * w.signed / made) : 0;
    cards.push(card(
      only ? `${made} of ${made}` : `${topN} of ${made}`,
      `proposals were ${esc(String(top).replace(/_/g, " "))}`,
      only
        ? `Five kinds of agreement are available - peace, ceasefire,
           non-aggression, alliance, and trade in gold or technology - and only
           this one has ever been proposed. ${rate}% were accepted.`
        : `${kinds.map(([k, n]) => `${n} ${esc(String(k).replace(/_/g, " "))}`).join(", ")}.
           ${rate}% of proposals were accepted.`,
      only ? "warn" : ""));
  }

  // --- who is gone, and to what --------------------------------------------
  for (const g of w.gone) {
    const civ = civOf(g.who);
    const row = S.signals?.[g.who] || {};
    const toWild = (row.lostToWild || 0) + (row.sacked || 0);
    const byRival = (row.fights || 0) - (row.wildFights || 0);
    cards.push(card(
      `turn ${g.turn}`,
      `${esc(civ?.model || civ?.civ_name || g.who)} was eliminated`,
      `It lost ${row.lostToWild || 0} units and ${row.sacked || 0} cities to the
       wilderness, and fought ${byRival} times against a rival. When the first
       number dwarfs the second, the map removed that civ rather than its
       opponents did.`,
      "bad"));
  }

  if (!cards.length) {
    return `<div class="empty">Too early to say anything worth saying. Insights
      appear once there is enough of a match to draw them from.</div>`;
  }
  return cards.join("") + `<div class="tick">Every figure is as of turn ${turn},
    not the whole match - scrub back and a finding can disappear, which is the
    honest behaviour for something calling itself an insight.</div>`;
}

/** One finding: a figure, what it counts, and the sentence that qualifies it. */
function card(figure, label, body, tone = "") {
  return `<div class="insight ${tone}">
    <div class="ifig">${figure}</div>
    <div class="ibody"><div class="ilabel">${label}</div>
      <p>${body}</p></div></div>`;
}

function panels() {
  const f = S.frame, e = f.economy;
  const sign = (n) => (n ? `<span class="${n<0?"neg":"pos"}">${n>0?"+":""}${n}</span>` : "");
  const hidden = `<td colspan="5" class="unseen">not in contact</td>`;
  $("economy").innerHTML = `<table><thead><tr><th>civ</th><th>gold</th><th>food</th>
    <th>prod</th><th>sci</th><th>c/u</th><th>score</th></tr></thead><tbody>${
    S.match.civs.map((c) => {
      const d = e[c.player_id] || {};
      const name = `<td class="name" title="${c.civ_name} · ${c.model || "?"}">
        <span class="civ"><span class="dot" style="background:${CSS[c.colour]}"></span><span>${
          esc(c.model || c.civ_name)}</span></span></td>`;
      if (!knows(c.player_id)) return `<tr class="fogged">${name}${hidden}</tr>`;
      return `<tr class="${d.alive?"":"dead"}">${name}
        <td>${d.gold??0} ${sign(d.gold_per_turn??0)}</td><td>${d.food_stored??0} ${sign(d.food_surplus??0)}</td>
        <td>${d.production_per_turn??0}</td><td>${d.science_per_turn??0}</td>
        <td>${d.cities??0}/${d.units??0}</td><td>${d.score??0}</td></tr>`;
    }).join("")}</tbody></table>
    ${(() => {
      const rows = S.match.civs
        .filter((c) => (S.frame.economy?.[c.player_id] || {}).alive !== false)
        .map((c) => ({ c, e: S.frame.economy?.[c.player_id] || {} }));
      if (!rows.length) return "";
      const slices = rows.map(({ c, e }) => ({
        name: c.model || c.civ_name, value: e.score || 0, colour: CSS[c.colour],
      }));
      return `<div class="chart">
          ${donut(slices, { label: "share of score", centre: (t) => t.toLocaleString() })}
          <div class="sharelist"><div class="charthead">share of score</div>
            ${shares(slices, (v) => String(v))}</div></div>
        <div class="charthead" style="margin-top:8px">output this turn</div>
        <div class="ygrid">${yieldBars(rows, [
          { key: "gold_per_turn", label: "gold", hint: "Net gold per turn after upkeep." },
          { key: "food_surplus", label: "food", hint: "Food surplus per turn across all cities - what growth runs on." },
          { key: "production_per_turn", label: "prod", hint: "Production per turn across all cities." },
          { key: "science_per_turn", label: "sci", hint: "Science per turn - what the tech race runs on." },
          { key: "culture_per_turn", label: "cult", hint: "Culture per turn, which feeds the score at the turn limit." },
        ])}</div>`;
    })()}`;

  // The cost meter. Deliberately *not* fog-limited: what a run cost is a fact
  // about the experiment rather than about the game, and hiding another
  // model's bill from you in agent mode would be fog cosplay - no agent ever
  // saw any of this, including its own.
  const totals = S.match.civs.map((c) => ({ c, s: S.spend?.[c.player_id] })).filter((r) => r.s);
  const grand = totals.reduce((a, r) => a + r.s.usd, 0);
  $("cost").innerHTML = !totals.length ? `<div class="empty">No spend recorded.</div>` : `
    <table><thead><tr>
      <th title="Which model played this seat.">model</th>
      <th title="What this seat has cost so far, in US dollars, from the token counts the vendor actually reported - never an estimate. This is what the budget cap is measured against.">$</th>
      <th title="Output tokens produced, including reasoning tokens where the vendor bills them as output. This is the expensive half: output runs about five times the price of input.">out</th>
      <th title="Share of input tokens served from cache at roughly a tenth the price. The system prompt is identical every turn, so a healthy number here is large. Zero is worth investigating on a vendor with an explicit cache breakpoint.">cache</th>
      <th title="Median wall-clock seconds per turn. Turns resolve simultaneously, so the slowest seat sets the pace of the whole match.">sec</th>
      <th title="How hard this seat was told to think on this turn. Shown every turn rather than only when it moves, so a steady seat reads as deliberate rather than as missing data. A green mark means it changed from the turn before. Hover the value for the vendor's own form of it - the four do not share an instrument, so 'medium' is an enum on some seats and a token budget on others.">effort</th>
      <th title="Score gained per 100,000 tokens spent. The efficiency figure: it compares a cheap model playing adequately against an expensive one playing slightly better, and a leaderboard by this can invert a leaderboard by score.">/100k</th>
      </tr></thead><tbody>${
      totals.map(({ c, s }) => {
        const tokens = s.input + s.output + s.cached;
        const score = (S.frame.economy?.[c.player_id] || {}).score || 0;
        // Score per 100k tokens: the one number that compares a cheap model
        // playing adequately against an expensive one playing slightly better.
        const per = tokens ? (score / (tokens / 100000)) : 0;
        // Against input alone, which is what the column header promises and the
        // only denominator that means anything: output tokens were never
        // cacheable, so including them measures how talkative a model is rather
        // than how well its prefix is being reused. A seat reading half its
        // prefix from cache reported 13% purely because it thought at length.
        const inTokens = s.input + s.cached;
        const cachePct = inTokens ? Math.round(100 * s.cached / inTokens) : 0;
        return `<tr><td class="name" title="${esc(c.model || "")} playing ${c.civ_name}">
          <span class="civ"><span class="dot" style="background:${CSS[c.colour]}"></span><span>${
            esc(c.model || c.civ_name)}</span></span></td>
          <td>${s.usd.toFixed(3)}</td><td>${s.output >= 1e6 ? (s.output/1e6).toFixed(2) + "M" : (s.output/1000).toFixed(1) + "k"}</td>
          <td class="${cachePct ? "" : "warn"}" title="${cachePct ? "" :
            "no cache reads. Worth chasing on a vendor with an explicit breakpoint - " +
            "a prefix written and never read costs 12.5x. On Gemini it is expected: " +
            "implicit caching does not engage below roughly 17k tokens and our prefix " +
            "is 2.2k, where the whole saving would be about 18 cents a match."
            }">${cachePct}%</td>
          <td>${(s.ms / s.turns / 1000).toFixed(0)}</td>
          ${effortCell(s)}
          <td>${per.toFixed(0)}</td></tr>`;
      }).join("")}</tbody></table>
    ${(() => {
      const slices = totals.map(({ c, s }) => ({
        name: c.model || c.civ_name, value: s.usd, colour: CSS[c.colour],
      }));
      return `<div class="chart">
        ${donut(slices, { label: "share of spend", centre: (t) => "$" + t.toFixed(2) })}
        <div class="sharelist"><div class="charthead">share of spend</div>
          ${shares(slices, (v) => "$" + v.toFixed(3))}</div></div>`;
    })()}
    ${effortVariation(totals)}
    <div class="tick" style="margin-top:6px">$${grand.toFixed(3)} through turn ${S.turn}
      · ${(grand / S.turn * S.match.turn_limit).toFixed(2)} projected at the cap</div>`;

  // In agent mode only the focused civ's own thinking is shown. A rival's
  // private deliberation is the single largest thing an agent cannot see, and
  // printing all four next to a board drawn under fog made the fog decorative.
  const thinkers = S.match.civs.filter(
    (c) => f.reasoning?.[c.player_id] && (S.mode !== "agent" || c.player_id === S.focus)
  );
  $("reasoning").innerHTML = thinkers.map((c) => {
    const d = f.reasoning[c.player_id];
    // Collapsed by default, one open at a time. Bot matches produced a single
    // sentence here; real agents produce fifteen hundred characters of numbered
    // execution steps, and four of those in a column pushed the diplomacy feed
    // and the event ticker off the screen entirely.
    const open = S.expanded === c.player_id || thinkers.length === 1;
    const detail = open ? `
      ${d.assessment ? `<p><b>Situation.</b> ${linkRefs(esc(d.assessment))}</p>` : ""}
      ${(d.threats||[]).length ? `<p><b>Threats.</b> ${linkRefs(esc((d.threats||[]).join(" · ")))}</p>` : ""}
      <p class="plan"><b>Plan.</b> ${linkRefs(esc(d.plan||"—"))}</p>
      ${d.confidence != null ? `<p class="meta">confidence ${d.confidence}</p>` : ""}` : `
      <p class="plan clamp">${linkRefs(esc(d.plan||"—"))}</p>`;
    return `<div class="card ${open?"open":""}" data-civ="${c.player_id}">
      <div class="who"><span class="dot" style="background:${CSS[c.colour]}"></span>${c.model || c.civ_name}
        <span class="meta">${
          // The civ name only earns its space when it says something the label
          // does not. Since the civs are named after the models, the two are
          // identical on a live roster and printing both read as a stutter.
          c.civ_name === (c.model || c.civ_name) ? "" : esc(c.civ_name) + " · "
        }${open?"▾":"▸"}</span></div>${detail}</div>`;
  }).join("") || `<div class="empty">No reasoning this turn.</div>`;
  $("reasoning").onclick = (ev) => {
    const card = ev.target.closest(".card[data-civ]");
    if (!card) return;
    S.expanded = S.expanded === card.dataset.civ ? null : card.dataset.civ;
    panels();
  };

  // Anything other than plain neutrality, which includes a pact. Filtering on
  // `state !== "neutral"` alone hid every non-aggression pact in the match,
  // because a pact does not change the state - it is a promise with an expiry
  // sitting on top of it.
  const rel = Object.entries(f.relations||{})
    .filter(([,v]) => v.state !== "neutral" || v.pact_until)
    .map(([k,v]) => {
      const pair = k.split("|").map((p) => nameOf(p)).join(" · ");
      const pact = v.pact_until
        ? (v.pact_until >= S.turn
            ? `<span class="pact">pact until ${v.pact_until}</span>`
            : `<span class="pact lapsed">pact lapsed turn ${v.pact_until}</span>`)
        : "";
      const state = v.state !== "neutral"
        ? `<b>${v.state}</b> since turn ${v.since}` : "";
      return `<div class="tick">${pair} ${state} ${pact}</div>`;
    });
  drawDiplomacy(rel);


  const dossierCount = drawDossier(f);

  // Events are already attributed, so the same rule applies: a civ hears about
  // what happened to it and what happened in public, not about a rival's
  // interior life.
  const audible = (ev) =>
    S.mode !== "agent" || !S.focus || !ev.actor || ev.actor === S.focus || knows(ev.actor);
  const shown = (f.events||[]).filter(audible);
  $("events").innerHTML = shown.map((ev)=>`<div class="tick">${
    ev.actor?`<b style="color:${cssOf(ev.actor)}">${ev.actor}</b> `:""}${esc(ev.text)}</div>`).join("")
    || `<div class="empty">Quiet turn.</div>`;

  // What each collapsed section would show, so closing one costs no awareness.
  // `hot` marks what changed *this* turn - a dossier edit, something said -
  // because those are the reasons to open a section you had shut. Written last,
  // where every value it reads already exists: an earlier attempt sat above the
  // panels it counted and threw a temporal-dead-zone error on every render,
  // which the page survived by simply never drawing the sections below it.
  const saidNow = (f.messages || []).filter(
    (m) => S.mode !== "agent" || !S.focus || m.channel !== "private"
      || m.from === S.focus || m.to === S.focus
  ).length;
  badge("economy", S.match.civs.length);
  const found = insights();
  $("insights").innerHTML = found;
  badge("insights", (found.match(/class="insight /g) || []).length);
  badge("cost", Object.keys(S.spend || {}).length);
  badge("reasoning", thinkers.length);
  badge("dossier", dossierCount.label, dossierCount.hot);
  badge("messages", saidNow, saidNow > 0);
  badge("events", shown.length);
  drawSignals();
}

/**
 * The at-a-glance read: where each civ is pointed, and what is being done to it.
 *
 * The raw panels above answer "what happened this turn" well and "is anyone in
 * trouble" badly - that question is cumulative and comparative, and reading it
 * out of thirty turns of prose is not realistic. Everything here is derived
 * from data the bundle already carries and folded to the current turn.
 */
/**
 * The dossier panel.
 *
 * Extracted from `panels` for one specific reason: the "all" view returns
 * early, and while this lived inline that `return` took the whole of `panels`
 * with it - so with the default picker selected, Events, Signals and every
 * count badge rendered nothing at all. No error, no console warning, just
 * three sections that were never drawn; the same shape as the
 * temporal-dead-zone bug noted further down. A `return` is only safe in a
 * function that does one thing, so now it is one.
 *
 * Returns what the badge needs, which is all the caller still wants from here.
 */
function drawDossier(f) {
  // The dossier: the agent's own memory, returned to it verbatim every turn.
  // Arguably the single most interesting artifact the lab produces, and until
  // now it was in the bundle and on no screen. Shown for one civ at a time -
  // the focused one in agent mode, the expanded one in god mode - because four
  // of these side by side is unreadable and comparing them is not the point.
  // The point is watching one change.
  // Explicit, not inherited. It used to follow whichever reasoning card was
  // expanded, which meant the panel silently changed subject and gave no way to
  // say "show me this one" - so it read as "the dossier" rather than "one civ's
  // dossier", which is a different and much more confusing thing.
  const who = S.mode === "agent" ? S.focus
    : (S.dossierOf || S.expanded || S.match.civs[0].player_id);
  const doc = S.dossiers?.[who];
  const was = S.dossiersBefore?.[who];
  const edited = JSON.stringify(doc) !== JSON.stringify(was);
  const list = (items, old) => (items || []).map((x) =>
    `<li class="${(old||[]).includes(x) ? "" : "fresh"}">${esc(x)}</li>`).join("");
  const showAll = S.mode !== "agent" && S.dossierOf === "all";
  // Who revised their notes on the turn being viewed. Carried onto the picker
  // itself so the answer to "did anyone write anything" is visible without
  // opening four tabs to find out - which is the difference between reading a
  // panel and interrogating it.
  const editedNow = (pid) => !!(f.dossiers || {})[pid];
  const picker = S.mode === "agent" ? "" : `<div class="picker">
    <button class="who-btn" data-who="all" aria-pressed="${showAll}">all</button>${
    S.match.civs.map((c) => `<button class="who-btn ${editedNow(c.player_id) ? "wrote" : ""}"
      data-who="${c.player_id}" title="${editedNow(c.player_id)
        ? "revised its dossier this turn" : "no change this turn"}"
      aria-pressed="${!showAll && c.player_id === who}">${esc(c.model || c.civ_name)}</button>`).join("")
  }</div>`;
  // Said plainly, because it is the panel people most often misread: this is
  // not a log of everything the agent thought. It is the small note the agent
  // chooses to write to itself and is handed back verbatim next turn. The
  // turn-by-turn thinking is the Reasoning panel, for all four civs at once.
  const note = `<p class="meta">What this agent chose to remember. Its
    turn-by-turn thinking is in Reasoning. <b>trusts:</b> how far it believes
