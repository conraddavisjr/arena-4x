<!doctype html>
<meta charset="utf-8">
<title>ARENA-4X world</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  The 3D replay viewer.

  Same contract as the flat one: a pure function of the bundle, with no API
  client, no keys and no writes. What it adds is a camera you can orbit, which
  turns the one real objection to 3D - a mountain range hiding the army behind
  it - into the reason to move.

  three.js is vendored rather than pulled from a CDN so the page works offline
  and carries no third-party origin.
-->
<style>
  :root {
    --bg:#0b0f14; --panel:#12171f; --line:#222a35; --ink:#e6edf3; --dim:#8b949e; --faint:#4d5560;
    --c0:#4ade80; --c1:#fbbf24; --c2:#38bdf8; --c3:#f472b6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;overflow:hidden}
  main{position:relative;display:flex;flex-direction:column;min-width:0}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
  #stage{flex:1;min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%}

  header{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:10px;align-items:center;
    padding:10px 14px;background:linear-gradient(#0b0f14ee,#0b0f1400);flex-wrap:wrap}
  h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.04em}
  button{background:#1b222c;color:var(--ink);border:1px solid var(--line);padding:5px 10px;
    border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
  button:hover{background:#28313d}
  button[aria-pressed="true"]{background:#2f6feb;border-color:#2f6feb}
  .scrub{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);
    background:var(--panel)}
  input[type=range]{flex:1;accent-color:#2f6feb}
  .turn{font-variant-numeric:tabular-nums;min-width:96px;color:var(--dim)}
  .hint{position:absolute;bottom:8px;left:14px;color:var(--faint);font-size:11px;z-index:2}

  section{border-bottom:1px solid var(--line);padding:12px 14px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
  th,td{text-align:right;padding:3px 4px}
  th:first-child,td:first-child{text-align:left}
  td.name{width:42%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  thead th{color:var(--dim);font-weight:500;font-size:11px;border-bottom:1px solid var(--line)}
  .civ{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dead{opacity:.4;text-decoration:line-through}
  .neg{color:#f87171}.pos{color:#4ade80}
  .card{background:#0f141b;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .card .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
  .card p{margin:2px 0;color:var(--dim)}.card p.plan{color:var(--ink)}
  .tick{color:var(--dim);padding:1px 0}.tick b{color:var(--ink);font-weight:500}
  .empty{color:var(--faint);font-style:italic}
  .msg{border-left:2px solid var(--line);padding:4px 0 4px 8px;margin-bottom:6px}
  .msg.private{border-left-color:#f472b6}
  .msg .meta{color:var(--faint);font-size:11px}
  tr.fogged td{color:var(--faint)}
  td.unseen{text-align:center;font-style:italic;color:var(--faint)}
  .card[data-civ]{cursor:pointer}
  .card[data-civ]:hover{border-color:#33404f}
  .card .meta{color:var(--faint);font-size:11px}
  .card p b{color:var(--dim);font-weight:600}
  /* Collapsed reasoning is clamped rather than hidden: enough to recognise the
     turn at a glance, not enough to bury the three panels underneath it. */
  .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #dossier .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px}
  #dossier p{margin:4px 0;color:var(--dim)}
  #dossier b{color:var(--ink);font-weight:600}
  #dossier ul{margin:2px 0 8px;padding-left:16px;color:var(--dim)}
  #dossier li{margin:2px 0}
  /* What changed since last turn. The dossier is mostly stable, so the edit is
     the signal and the rest is context. */
  .fresh{color:var(--ink)}
  #dossier li.fresh::marker{color:#4ade80}
  .edited{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#4ade80;
    border:1px solid #245c38;border-radius:3px;padding:1px 5px}
  .trust{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
  .trust.high{color:#4ade80;border-color:#245c38}
  .trust.medium{color:#fbbf24;border-color:#5c4a24}
  .trust.low{color:#f87171;border-color:#5c2424}
</style>

<main>
  <div id="stage">
    <header>
      <h1>ARENA-4X</h1>
      <div id="modes" style="display:flex;gap:2px"></div>
      <button id="play">▶ Play</button>
      <button id="top">Top-down</button>
      <span class="turn" id="status"></span>
    </header>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <div class="scrub">
    <button id="prev">‹</button>
    <input type="range" id="slider" min="1" value="1">
    <button id="next">›</button>
    <span class="turn" id="turnLabel"></span>
  </div>
</main>

<aside>
  <section><h2>Empires</h2><div id="economy"></div></section>
  <section><h2>Reasoning</h2><div id="reasoning"></div></section>
  <section><h2>Dossier</h2><div id="dossier"></div></section>
  <section><h2>Diplomacy</h2><div id="messages"></div></section>
  <section><h2>Events</h2><div id="events"></div></section>
</aside>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/":"./vendor/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/OrbitControls.js";
import {
  HEIGHT, GROUND, CIV_COLOURS, WILD_COLOUR, axialToWorld,
  buildTerrain, buildScatter, buildResources, buildBorders, buildSettlements,
  unitModel, baseGeometry, surfaceAtlas,
} from "./world.js";

const BASE = new URLSearchParams(location.search).get("match") || ".";
const CSS = ["var(--c0)", "var(--c1)", "var(--c2)", "var(--c3)"];
const UNIT_TYPES = ["settler","worker","scout","warrior","archer","spearman",
                    "swordsman","horseman","catapult","trireme","wolf","barbarian"];

const S = { match:null, frame:null, turn:1, mode:"god", focus:null, playing:null,
            index:null, expanded:null, dossiers:{}, dossiersBefore:{}, priorTrust:{} };
const cache = new Map();
const $ = (id) => document.getElementById(id);
const civOf = (id) => S.match.civs.find((c) => c.player_id === id);
const cssOf = (id) => (civOf(id) ? CSS[civOf(id).colour % 4] : "#9aa0aa");
const hexOf = (id) => (civOf(id) ? CIV_COLOURS[civOf(id).colour % 4] : WILD_COLOUR);
const nameOf = (id) => (civOf(id) ? civOf(id).civ_name : "Wilderness");
const esc = (s) => String(s).replace(/[<>&]/g,(c)=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

// --- scene -----------------------------------------------------------------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;  // PCFSoft is deprecated in r185
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
scene.fog = new THREE.Fog(0x0b0f14, 46, 96);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// Clamped below the horizon: dropping under the terrain would show the world
// from beneath and read as a bug rather than a viewpoint.
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 6;
controls.maxDistance = 220;

scene.add(new THREE.HemisphereLight(0xbcd7ff, 0x2b2418, 1.5));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.1);
sun.position.set(24, 34, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:120 });
scene.add(sun);

const staticLayer = new THREE.Group();   // terrain, scatter - built once
const dynamicLayer = new THREE.Group();  // units, cities, borders - per turn
scene.add(staticLayer, dynamicLayer);

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// --- data ------------------------------------------------------------------
async function loadFrame(turn) {
  if (cache.has(turn)) return cache.get(turn);
  const res = await fetch(`${BASE}/turns/${String(turn).padStart(4,"0")}.json`);
  const frame = await res.json();
  cache.set(turn, frame);
  return frame;
}

/**
 * Everything that is a running total rather than a per-turn fact.
 *
 * Borders are written as deltas, and "has this civ ever seen this tile" is by
 * definition cumulative, so both are folded forward from turn 1. Frames are
 * cached, so this is a loop over memory rather than a refetch.
 */
async function foldTo(turn) {
  const owners = new Array(S.match.terrain.length).fill(null);
  const explored = new Map(S.match.civs.map((c) => [c.player_id, new Set()]));
  // Dossiers are written as deltas, so the current one is the fold and the
  // previous one is the fold stopped a turn short. Keeping both is what lets
  // the panel show the *edit* rather than just the text.
  let dossiers = {};
  let before = {};
  // The last view each agent expressed about each rival, whenever it expressed
  // it. Not the same as "what its dossier said last turn": agents rewrite the
  // whole dossier rather than editing it, so an opponent model can vanish for
  // several turns and come back revised. Diffing only against the previous turn
  // missed every one of those - which is most of them.
  const priorTrust = {};
  for (let t = 1; t <= turn; t++) {
    const f = await loadFrame(t);
    for (const [i, who] of Object.entries(f.owners || {})) owners[+i] = who;
    for (const [pid, tiles] of Object.entries(f.visibility || {})) {
      const seen = explored.get(pid);
      if (seen) for (const i of tiles) seen.add(i);
    }
    if (t < turn) {
      for (const [pid, doc] of Object.entries(f.dossiers || {})) {
        for (const m of doc.opponent_models || []) {
          (priorTrust[pid] ??= {})[m.player_id] = m.trustworthiness;
        }
      }
    }
    before = dossiers;
    dossiers = { ...dossiers, ...(f.dossiers || {}) };
  }
  return { owners, explored, dossiers, before, priorTrust };
}

// --- rendering -------------------------------------------------------------
// Recursive, because the border layer is a group of one mesh per civ and
// popping it without walking into it would leak a geometry on every turn step.
const clear = (group) => {
  while (group.children.length) {
    group.children.pop().traverse((o) => {
      o.geometry?.dispose?.();
      o.material?.dispose?.();
    });
  }
};

const M = new THREE.Matrix4();
const C = new THREE.Color();

function topOf(index) {
  return HEIGHT[S.match.terrain[index]] ?? 0.36;
}

function instanced(geo, count, opts = {}) {
  const mesh = new THREE.InstancedMesh(
    geo,
    new THREE.MeshLambertMaterial({ flatShading: true, ...opts }),
    count
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/**
 * Fog of war, in the three states Freeciv uses: currently in sight, seen
 * before and remembered, and never visited.
 *
 * Applied to the terrain rather than only to the units on it. Hiding the units
 * but leaving the ground fully lit was the weak part of the agent view, because
 * the whole point of that view is seeing what a model could *not* see when it
 * made a bad call - and unexplored ground is most of what it could not see.
 */
function applyFog(lit, explored) {
  const shade = !lit
    ? () => 1
    : (i) => (lit.has(i) ? 1 : explored?.has(i) ? 0.5 : 0.13);
  for (const layer of staticLayer.children) layer.userData.paint?.(shade);
}

async function drawTurn() {
  const f = S.frame;
  clear(dynamicLayer);

  const lit = S.mode === "agent" && S.focus ? new Set(f.visibility[S.focus] || []) : null;
  const { owners, explored, dossiers, before, priorTrust } = await foldTo(S.turn);
  S.dossiers = dossiers;
  S.dossiersBefore = before;
  S.priorTrust = priorTrust;
  const known = S.focus ? explored.get(S.focus) : null;
  applyFog(lit, known);
  const at = (i) => {
    const [q, r] = S.match.tiles[i].split(",").map(Number);
    return axialToWorld(q, r);
  };

  // Territory: a coloured line along the *edge* of the claim. See buildBorders
  // for why this replaced a tint over the whole tile.
  //
  // Drawn on explored ground rather than only on what is currently in sight, so
  // an empire keeps its shape in the agent view. That does show the *current*
  // owner of a fogged tile rather than the last one this civ actually saw; the
  // bundle carries no per-civ memory of ownership, and the alternative - border
  // lines that blink out the moment a scout walks away - was worse.
  dynamicLayer.add(buildBorders(
    S.match.tiles, owners, topOf, hexOf, lit ? (i) => known?.has(i) : null
  ));

  // Towns: plaza, buildings, a curtain wall if built, a keep for a temple or
  // wonder. Walls take their own baked colours; only the roofs carry the civ.
  const cities = f.cities.filter((c) => !lit || lit.has(c.at));
  dynamicLayer.add(buildSettlements(cities, (tile) => {
    const [x, , z] = at(tile);
    return [x, topOf(tile), z];
  }, hexOf));

  // Units, one instanced mesh per type plus a shared ownership ring.
  const visible = f.units.filter((u) => !lit || lit.has(u.at));
  const bases = instanced(baseGeometry(), visible.length, { transparent: true, opacity: 0.9 });
  visible.forEach((u, n) => {
    const [x, , z] = at(u.at);
    M.makeScale(1, 1, 1).setPosition(x, topOf(u.at) + 0.02, z);
    bases.setMatrixAt(n, M);
    bases.setColorAt(n, C.setHex(hexOf(u.owner)));
  });
  bases.instanceMatrix.needsUpdate = true;
  bases.castShadow = false;
  dynamicLayer.add(bases);

  // Two meshes per unit type. `body` carries baked vertex colours - skin,
  // leather, wood, steel - and is never tinted, because instance colour
  // multiplies the whole mesh and tinting a soldier by his civ colour used to
  // tint his skin and his sword blade with it. `livery` is the tunics, shields
  // and sails, and is the only part that takes the civ colour.
  for (const type of UNIT_TYPES) {
    const of = visible.filter((u) => u.type === type);
    if (!of.length) continue;
    const model = unitModel(type);
    for (const [geo, civ] of [[model.body, false], [model.livery, true]]) {
      if (!geo) continue;
      const mesh = instanced(geo, of.length, {
        map: surfaceAtlas(), vertexColors: !civ,
      });
      of.forEach((u, n) => {
        const [x, , z] = at(u.at);
        // Face the board centre, so armies read as oriented rather than scattered.
        M.makeRotationY(Math.atan2(-x, -z))
          .setPosition(x, topOf(u.at) + (u.embarked ? -0.06 : 0.01), z);
        mesh.setMatrixAt(n, M);
        // Wounded units darken, so a battered stack is visible without a UI
        // probe. On the body that multiplies the baked colours; on the livery
        // it darkens the civ colour.
        C.setHex(civ ? hexOf(u.owner) : 0xffffff);
        mesh.setColorAt(n, C.lerp(new THREE.Color(0x2a1216), (100 - u.hp) / 220));
      });
      mesh.instanceMatrix.needsUpdate = true;
      dynamicLayer.add(mesh);
    }
  }
}

// --- panels ----------------------------------------------------------------
/**
 * What the focused civ is entitled to know about a rival this turn.
 *
 * The board has always respected the fog; this panel did not. In agent mode it
 * printed every rival's exact gold, food and score straight from the bundle's
 * god-truth economy - in the one view whose entire purpose is showing what a
 * civ could see when it made its decisions. Reading a bad call next to numbers
 * the agent never had is worse than not showing the panel at all.
 *
 * `contact` is directed and per-turn: `contact[observer]` lists the rivals that
 * observer can currently see. Score is revealed on contact and hidden again
 * when it lapses, which is what the engine's own intel view does.
 */
function knows(playerId) {
  if (S.mode !== "agent" || !S.focus || playerId === S.focus) return true;
  return (S.frame.contact?.[S.focus] || []).includes(playerId);
}

function panels() {
  const f = S.frame, e = f.economy;
  const sign = (n) => (n ? `<span class="${n<0?"neg":"pos"}">${n>0?"+":""}${n}</span>` : "");
  const hidden = `<td colspan="5" class="unseen">not in contact</td>`;
  $("economy").innerHTML = `<table><thead><tr><th>civ</th><th>gold</th><th>food</th>
    <th>prod</th><th>sci</th><th>c/u</th><th>score</th></tr></thead><tbody>${
    S.match.civs.map((c) => {
      const d = e[c.player_id] || {};
      const name = `<td class="name" title="${c.civ_name}">
        <span class="civ"><span class="dot" style="background:${CSS[c.colour]}"></span>${c.civ_name}</span></td>`;
      if (!knows(c.player_id)) return `<tr class="fogged">${name}${hidden}</tr>`;
      return `<tr class="${d.alive?"":"dead"}">${name}
        <td>${d.gold??0} ${sign(d.gold_per_turn??0)}</td><td>${d.food_stored??0} ${sign(d.food_surplus??0)}</td>
        <td>${d.production_per_turn??0}</td><td>${d.science_per_turn??0}</td>
        <td>${d.cities??0}/${d.units??0}</td><td>${d.score??0}</td></tr>`;
    }).join("")}</tbody></table>`;

  // In agent mode only the focused civ's own thinking is shown. A rival's
  // private deliberation is the single largest thing an agent cannot see, and
  // printing all four next to a board drawn under fog made the fog decorative.
  const thinkers = S.match.civs.filter(
    (c) => f.reasoning?.[c.player_id] && (S.mode !== "agent" || c.player_id === S.focus)
  );
  $("reasoning").innerHTML = thinkers.map((c) => {
    const d = f.reasoning[c.player_id];
    // Collapsed by default, one open at a time. Bot matches produced a single
    // sentence here; real agents produce fifteen hundred characters of numbered
    // execution steps, and four of those in a column pushed the diplomacy feed
    // and the event ticker off the screen entirely.
    const open = S.expanded === c.player_id || thinkers.length === 1;
    const detail = open ? `
      ${d.assessment ? `<p><b>Situation.</b> ${esc(d.assessment)}</p>` : ""}
      ${(d.threats||[]).length ? `<p><b>Threats.</b> ${esc((d.threats||[]).join(" · "))}</p>` : ""}
      <p class="plan"><b>Plan.</b> ${esc(d.plan||"—")}</p>
      ${d.confidence != null ? `<p class="meta">confidence ${d.confidence}</p>` : ""}` : `
      <p class="plan clamp">${esc(d.plan||"—")}</p>`;
    return `<div class="card ${open?"open":""}" data-civ="${c.player_id}">
      <div class="who"><span class="dot" style="background:${CSS[c.colour]}"></span>${c.civ_name}
        <span class="meta">${open?"▾":"▸"}</span></div>${detail}</div>`;
  }).join("") || `<div class="empty">No reasoning this turn.</div>`;
  $("reasoning").onclick = (ev) => {
    const card = ev.target.closest(".card[data-civ]");
    if (!card) return;
    S.expanded = S.expanded === card.dataset.civ ? null : card.dataset.civ;
    panels();
  };

  const rel = Object.entries(f.relations||{}).filter(([,v])=>v.state!=="neutral")
    .map(([k,v])=>`<div class="tick">${k.replace("|"," · ")} <b>${v.state}</b> since turn ${v.since}</div>`);
  // A private message is readable by exactly two civs. In agent mode the feed
  // shows the public channel plus this civ's own correspondence and nothing
  // else - reading someone else's DMs is the most direct way there is to see
  // something an agent could not.
  const mine = (m) =>
    S.mode !== "agent" || !S.focus ||
    m.channel !== "private" || m.from === S.focus || m.to === S.focus;
  const said = (f.messages||[]).filter(mine);
  $("messages").innerHTML = (said.map((m)=>`<div class="msg ${m.channel}">
      <div class="meta">${nameOf(m.from)}${m.to?` → ${nameOf(m.to)}`:" · public"}</div>${esc(m.text)}</div>`).join("")
      || `<div class="empty">Nothing said this turn.</div>`) +
    (rel.length?`<div style="margin-top:8px">${rel.join("")}</div>`:"");

  // The dossier: the agent's own memory, returned to it verbatim every turn.
  // Arguably the single most interesting artifact the lab produces, and until
  // now it was in the bundle and on no screen. Shown for one civ at a time -
  // the focused one in agent mode, the expanded one in god mode - because four
  // of these side by side is unreadable and comparing them is not the point.
  // The point is watching one change.
  const who = S.mode === "agent" ? S.focus : (S.expanded || S.match.civs[0].player_id);
  const doc = S.dossiers?.[who];
  const was = S.dossiersBefore?.[who];
  const edited = JSON.stringify(doc) !== JSON.stringify(was);
  const list = (items, old) => (items || []).map((x) =>
    `<li class="${(old||[]).includes(x) ? "" : "fresh"}">${esc(x)}</li>`).join("");
  $("dossier").innerHTML = !doc ? `<div class="empty">Nothing written yet.</div>` : `
    <div class="who"><span class="dot" style="background:${cssOf(who)}"></span>${nameOf(who)}
      ${edited ? `<span class="edited">edited this turn</span>` : ""}</div>
    <p class="${doc.doctrine !== was?.doctrine ? "fresh" : ""}"><b>Doctrine.</b>
      ${esc(doc.doctrine || "—")}</p>
    ${(doc.opponent_models || []).map((m) => {
      const old = (was?.opponent_models || []).find((o) => o.player_id === m.player_id);
      // The one line worth building all of this for. A model rewriting
      // `trustworthiness: high` to `low` two turns after a betrayal is the
      // whole experiment, and it is a single word in a single field.
      const prior = S.priorTrust?.[who]?.[m.player_id];
      const turned = prior && prior !== m.trustworthiness;
      return `<p class="${old ? "" : "fresh"}"><b>${nameOf(m.player_id)}</b>
        <span class="trust ${m.trustworthiness} ${turned ? "fresh" : ""}">${m.trustworthiness}</span>
        ${turned ? `<span class="edited">was ${prior}</span>` : ""}
        <br>${esc(m.assessed_intent || "")}${m.notes ? ` · ${esc(m.notes)}` : ""}</p>`;
    }).join("")}
    ${(doc.standing_commitments || []).length ? `<p><b>Commitments.</b></p>
      <ul>${list(doc.standing_commitments, was?.standing_commitments)}</ul>` : ""}
    ${(doc.lessons || []).length ? `<p><b>Lessons.</b></p>
      <ul>${list(doc.lessons, was?.lessons)}</ul>` : ""}`;

  // Events are already attributed, so the same rule applies: a civ hears about
  // what happened to it and what happened in public, not about a rival's
  // interior life.
  const audible = (ev) =>
    S.mode !== "agent" || !S.focus || !ev.actor || ev.actor === S.focus || knows(ev.actor);
  $("events").innerHTML = (f.events||[]).filter(audible).map((ev)=>`<div class="tick">${
    ev.actor?`<b style="color:${cssOf(ev.actor)}">${ev.actor}</b> `:""}${esc(ev.text)}</div>`).join("")
    || `<div class="empty">Quiet turn.</div>`;
}

async function show(turn) {
  S.turn = Math.max(1, Math.min(turn, S.match.turns));
  S.frame = await loadFrame(S.turn);
  $("slider").value = S.turn;
  $("turnLabel").textContent = `turn ${S.turn} / ${S.match.turns}`;
  const v = S.match.victory;
  $("status").textContent = v && S.turn >= S.match.turns
    ? `${nameOf(v.winner)} won by ${v.condition}` : "";
  await drawTurn();
  panels();
  for (const t of [S.turn+1, S.turn+2]) if (t <= S.match.turns) loadFrame(t).catch(()=>{});
}

function togglePlay() {
  if (S.playing) { clearInterval(S.playing); S.playing = null; $("play").textContent = "▶ Play"; return; }
  $("play").textContent = "❚❚ Pause";
  S.playing = setInterval(async () => {
    if (S.turn >= S.match.turns) return togglePlay();
    await show(S.turn + 1);
  }, 700);
}

(async function init() {
  S.match = await (await fetch(`${BASE}/match.json`)).json();

  staticLayer.add(buildTerrain(S.match.tiles, S.match.terrain));
  staticLayer.add(buildScatter(S.match.tiles, S.match.terrain));
  staticLayer.add(buildResources(S.match.tiles, S.match.terrain, S.match.resources));

  // Frame the board from its actual bounds. A hardcoded camera distance cropped
  // the map off every edge, and would have broken again on any other radius.
  const pts = S.match.tiles.map((k) => axialToWorld(...k.split(",").map(Number)));
  const x0 = Math.min(...pts.map((p)=>p[0])), x1 = Math.max(...pts.map((p)=>p[0]));
  const z0 = Math.min(...pts.map((p)=>p[2])), z1 = Math.max(...pts.map((p)=>p[2]));
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const extent = Math.max(x1 - x0, z1 - z0);
  resize();
  // Fit the wider of the two axes, allowing for the viewport being wider than
  // it is tall, then back off a little so the board is not flush to the frame.
  const vFov = (camera.fov * Math.PI) / 180;
  const fit = extent / (2 * Math.tan(vFov / 2) * Math.min(1, camera.aspect)) * 1.15;
  S.home = { target: new THREE.Vector3(cx, 0, cz), dist: fit };
  controls.target.copy(S.home.target);
  camera.position.set(cx, fit * 0.72, cz + fit * 0.66);
  scene.fog.near = fit * 0.9;
  scene.fog.far = fit * 2.4;

  $("modes").innerHTML = [["god","God"], ...S.match.civs.map((c)=>[`agent:${c.player_id}`, c.civ_name.split(" ")[0]])]
    .map(([k,label]) => `<button data-mode="${k}" aria-pressed="${k==="god"}">${label}</button>`).join("");
  $("modes").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const [mode, who] = b.dataset.mode.split(":");
    S.mode = mode; S.focus = who || null;
    for (const x of $("modes").children) x.setAttribute("aria-pressed", x === b);
    // The panels are fog-aware now, so a mode change has to redraw them too.
    S.expanded = S.focus;
    drawTurn();
    panels();
  };
  $("top").onclick = () => {
    controls.target.copy(S.home.target);
    camera.position.set(S.home.target.x, S.home.dist * 1.05, S.home.target.z + 0.01);
    controls.update();
  };
  $("slider").max = S.match.turns;
  $("slider").oninput = (e) => show(+e.target.value);
  $("prev").onclick = () => show(S.turn - 1);
  $("next").onclick = () => show(S.turn + 1);
  $("play").onclick = togglePlay;
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(S.turn - 1);
    if (e.key === "ArrowRight") show(S.turn + 1);
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
  });
  await show(1);
})();
</script>
