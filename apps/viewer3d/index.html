    that rival&#39;s word - its own judgement, revised as promises are kept or
    broken. Not a threat rating.</p>`;
  // "All" shows every civ's memory side by side, including the ones that have
  // written nothing - an empty dossier is itself a finding, and two of four
  // models in the first match kept no opponent models at all. Scrubbing with
  // this open is how you watch four sets of notes diverge over a match.
  if (showAll) {
    $("dossier").innerHTML = picker + note + S.match.civs.map((c) => {
      const d = S.dossiers?.[c.player_id];
      const changed = !!(f.dossiers || {})[c.player_id];
      // Clamped by default and openable, rather than clamped full stop. The
      // summary is what makes four dossiers comparable at a glance; the full
      // text is what makes any one of them worth reading, and truncating a
      // model's own words with no way to see the rest is the one thing this
      // panel should never do.
      const open = S.dossierOpen === c.player_id;
      // This civ's own previous notes, not the picker's. Passing the wrong
      // one would mark every line "fresh" and turn the change highlighting
      // into decoration.
      const prev = S.dossiersBefore?.[c.player_id];
      return `<div class="card ${open ? "open" : ""}" data-doc="${c.player_id}">
        <div class="who">
        <span class="dot" style="background:${CSS[c.colour]}"></span>${esc(c.model || c.civ_name)}
        ${changed ? `<span class="edited">edited</span>` : ""}
        <span class="meta">${d ? (open ? "▾" : "▸") : ""}</span></div>
        ${!d ? `<p class="empty">Nothing written yet.</p>` : open ? `
        <p><b>Doctrine.</b> ${esc(d.doctrine || "—")}</p>
        ${(d.opponent_models || []).map((m) => `<p><b>${esc(nameOf(m.player_id))}</b>
          <span class="trust ${m.trustworthiness}" title="How far this civ trusts that rival&#39;s word, in its own judgement - not a threat rating and not a measure of strength. It is the one field the dossier asks a model to revise when evidence arrives, so a promise kept or broken is exactly what should move it."
            >trusts: ${m.trustworthiness}</span><br>
          ${esc(m.assessed_intent || "")}${m.notes ? ` · ${esc(m.notes)}` : ""}</p>`).join("")
          || `<p class="meta">no opponent models</p>`}
        ${(d.standing_commitments || []).length ? `<p><b>Commitments.</b></p>
          <ul>${list(d.standing_commitments, prev?.standing_commitments)}</ul>` : ""}
        ${(d.lessons || []).length ? `<p><b>Lessons.</b></p>
          <ul>${list(d.lessons, prev?.lessons)}</ul>` : ""}` : `
        <p class="clamp">${esc(d.doctrine || "no doctrine")}</p>
        <p class="meta">${(d.opponent_models || []).length
            ? (d.opponent_models || []).map((m) =>
                `${esc(nameOf(m.player_id))} <span class="trust ${m.trustworthiness}"
                  title="How far this civ trusts that rival&#39;s word, in its own judgement - not a threat rating and not a measure of strength. It is the one field the dossier asks a model to revise when evidence arrives, so a promise kept or broken is exactly what should move it.">trusts: ${m.trustworthiness}</span>`).join(" · ")
            : "no opponent models"} ·
          ${(d.standing_commitments || []).length} commitments ·
          ${(d.lessons || []).length} lessons</p>`}</div>`;
    }).join("");
    $("dossier").onclick = dossierPick;
    // How many civs revised their notes this turn - the reason to open a
    // section you had shut, and the only summary that means anything when
    // four dossiers are on screen at once.
    const edits = S.match.civs.filter((c) => (f.dossiers || {})[c.player_id]).length;
    return { label: edits ? `${edits} edited` : S.match.civs.length, hot: edits > 0 };
  }
  $("dossier").innerHTML = picker + (!doc ? `<div class="empty">Nothing written yet.</div>` : note + `
    <div class="who"><span class="dot" style="background:${cssOf(who)}"></span>${nameOf(who)}
      ${edited ? `<span class="edited">edited this turn</span>` : ""}</div>
    <p class="${doc.doctrine !== was?.doctrine ? "fresh" : ""}"><b>Doctrine.</b>
      ${esc(doc.doctrine || "—")}</p>
    ${(doc.opponent_models || []).map((m) => {
      const old = (was?.opponent_models || []).find((o) => o.player_id === m.player_id);
      // The one line worth building all of this for. A model rewriting
      // `trustworthiness: high` to `low` two turns after a betrayal is the
      // whole experiment, and it is a single word in a single field.
      const prior = S.priorTrust?.[who]?.[m.player_id];
      const turned = prior && prior !== m.trustworthiness;
      return `<p class="${old ? "" : "fresh"}"><b>${nameOf(m.player_id)}</b>
        <span class="trust ${m.trustworthiness} ${turned ? "fresh" : ""}"
          title="How far this civ trusts that rival&#39;s word, in its own judgement - not a threat rating and not a measure of strength. It is the one field the dossier asks a model to revise when evidence arrives, so a promise kept or broken is exactly what should move it.">trusts: ${m.trustworthiness}</span>
        ${turned ? `<span class="edited">was ${prior}</span>` : ""}
        <br>${esc(m.assessed_intent || "")}${m.notes ? ` · ${esc(m.notes)}` : ""}</p>`;
    }).join("")}
    ${(doc.standing_commitments || []).length ? `<p><b>Commitments.</b></p>
      <ul>${list(doc.standing_commitments, was?.standing_commitments)}</ul>` : ""}
    ${(doc.lessons || []).length ? `<p><b>Lessons.</b></p>
      <ul>${list(doc.lessons, was?.lessons)}</ul>` : ""}`);
  $("dossier").onclick = dossierPick;
  return { label: doc ? (edited ? "edited" : "1") : 0, hot: edited };
}

function drawSignals() {
  const f = S.frame;
  const rows = S.match.civs.map((c) => {
    const e = f.economy?.[c.player_id] || {};
    const g = S.signals?.[c.player_id] || { said: 0, dm: 0, lostToWild: 0, sacked: 0,
                                            met: new Set(), battles: 0 };
    return { c, e, g };
  });

  // Bars are scaled against the strongest civ rather than against an absolute,
  // because the question is always comparative: nobody cares that a civ makes
  // nine science, they care that it makes half what the leader makes.
  const peak = (pick) => Math.max(1, ...rows.map(({ e }) => pick(e) || 0));
  const gold = peak((e) => e.gold_per_turn);
  const food = peak((e) => e.food_surplus);
  const sci = peak((e) => e.science_per_turn);
  const prod = peak((e) => e.production_per_turn);
  const talk = Math.max(1, ...rows.map(({ g }) => g.said));
  const fights = Math.max(1, ...rows.map(({ g }) => g.fights));

  const bar = (segments) => `<span class="bars">${segments.map(([w, cls, title]) =>
    `<i class="${cls}" style="width:${Math.round(Math.max(0, Math.min(1, w)) * 100)}%"
      title="${title}"></i>`).join("")}</span>`;

  // A block per civ rather than a table row. Six columns in a 340px panel
  // truncated every model name to "claude-ha", and a block leaves room to add
  // signals without re-cutting the layout each time.
  $("signals").innerHTML = rows.map(({ c, e, g }) => {
    const units = e.units || 0;
    const military = e.military || 0;
    const hurt = g.lostToWild + g.sacked;
    // Every tag carries a title now. They read "met 3" and "12 sent" before,
    // which is a number and a word and no way to tell what either counted.
    const tags = [
      g.met.size
        ? `<span class="tag" title="Rivals this civ has made contact with - seen a
            unit or city of theirs at least once. Contact is what unlocks
            diplomacy with them.">met ${g.met.size}</span>`
        : "",
      g.said
        ? `<span class="tag" title="Messages, proposals and replies sent so far,
            public and private together.">${g.said} sent</span>`
        : "",
      g.lessons
        ? `<span class="tag" title="Lessons this civ keeps in its dossier - what it
            decided was worth remembering about how this world works. It writes
            them itself and reads them back every turn.">${g.lessons} lessons</span>`
        : "",
      g.rivalsModelled
        ? `<span class="tag" title="Rivals it has written an opinion about, with an
            assessed intent and a trust rating.">${g.rivalsModelled} judged</span>`
        : "",
      hurt
        ? `<span class="tag bad" title="${g.lostToWild} units lost and ${g.sacked}
            cities sacked by wolves and barbarians - the wilderness, not a
            rival.">${hurt} to wild</span>`
        : "",
    ].join("");
    return `<div class="sigrow">
      <div class="who"><span class="dot" style="background:${CSS[c.colour]}"></span>${
        esc(c.model || c.civ_name)}<span class="tags">${tags}</span></div>
      <div class="metric"><label>economy</label>${bar([
        [(e.food_surplus || 0) / food, "food", `${e.food_surplus || 0} food surplus/turn`],
        [(e.gold_per_turn || 0) / gold, "gold", `${e.gold_per_turn || 0} gold/turn`],
        [(e.science_per_turn || 0) / sci, "sci", `${e.science_per_turn || 0} science/turn`],
        [(e.production_per_turn || 0) / prod, "prod", `${e.production_per_turn || 0} production/turn`],
      ])}</div>
      <div class="metric"><label>army</label>${bar([[units ? military / units : 0, "mil",
        `${military} of ${units} units are military`]])}<span class="n">${military}/${units}</span></div>
      <div class="metric ${g.fights ? "clickable" : ""}" data-combat="${c.player_id}">
        <label>combat</label>${bar([
          [(g.fights - g.wildFights) / fights, "war", `${g.fights - g.wildFights} against rivals`],
          [g.wildFights / fights, "wild", `${g.wildFights} against the wilderness`],
        ])}<span class="n">${g.kills}/${g.losses}</span></div>
      <div class="metric"><label>talk</label>${bar([
        [(g.said - g.dm) / talk, "pub", `${g.said - g.dm} public`],
        [g.dm / talk, "dm", `${g.dm} private`],
      ])}<span class="n">${g.said || "0"}</span></div>
    </div>`;
  }).join("") + scienceRace(rows) + warFronts(rows) + `<div class="tick" style="margin-top:8px">economy is
    <b class="k food">food</b> / <b class="k gold">gold</b> / <b class="k sci">science</b> /
    <b class="k prod">production</b>, named in the order they are drawn -
    each scaled against the strongest civ · army is the
    <b class="k mil">military</b> share of units · talk is
    <b class="k pub">public</b> / <b class="k dm">private</b> · the wild is
    barbarians and wolves<br><b>met</b> rivals contacted ·
    <b>sent</b> messages and proposals · <b>lessons</b> and <b>judged</b> are
    what it keeps in its dossier · <b>to wild</b> is losses to wolves and
    raiders rather than to a rival</div>`;

  const pressure = rows.reduce((a, { g }) => a + g.lostToWild + g.sacked, 0);
  badge("signals", pressure || S.match.civs.length, pressure > 0);

  $("signals").onclick = (ev) => {
    const row = ev.target.closest("[data-combat]");
    if (!row) return;
    const pid = row.dataset.combat;
    S.combatOf = S.combatOf === pid ? null : pid;
    drawSignals();
  };
  if (S.combatOf) {
    const g = S.signals?.[S.combatOf];
    const detail = (g?.log || []).slice().reverse().map((c) => {
      const foe = c.mine === c.attacker ? c.defender : c.attacker;
      const attacking = c.mine === c.attacker;
      const mineDied = attacking ? c.attacker_died : c.defender_died;
      const theirsDied = attacking ? c.defender_died : c.attacker_died;
      const mineType = attacking ? c.attacker_type : c.defender_type;
      const theirType = attacking ? c.defender_type : c.attacker_type;
      const took = attacking ? c.attacker_damage : c.defender_damage;
      const dealt = attacking ? c.defender_damage : c.attacker_damage;
      return `<div class="fight ${mineDied ? "lost" : theirsDied ? "won" : ""}"
        data-turn="${c.turn}">
        <span class="meta">turn ${c.turn} · ${attacking ? "attacked" : "was attacked by"}</span>
        <span class="dot" style="background:${cssOf(foe)}"></span>${esc(nameOf(foe))}
        <div>${esc(mineType)} vs ${esc(theirType)} · dealt ${dealt}, took ${took}${
          theirsDied ? " · <b class=\"k pub\">killed them</b>" : ""}${
          mineDied ? " · <b class=\"k mil\">lost the unit</b>" : ""}</div></div>`;
    }).join("") || `<div class="empty">No fights yet.</div>`;
    $("signals").insertAdjacentHTML("beforeend",
      `<div class="fights"><div class="who"><span class="dot"
        style="background:${cssOf(S.combatOf)}"></span>${esc(nameOf(S.combatOf))} ·
        every fight so far <button class="thread" data-combat="${S.combatOf}">close</button>
        </div>${detail}</div>`);
  }
}

/**
 * The diplomacy console: one thread per relationship, the whole match at once.
 *
 * Selecting a message also shows what its sender was privately planning that
 * same turn. That pairing is the point - it is the difference between reading
 * what an agent *said* and reading what it *meant*, and it is the only way to
 * see a model tell one civ it wants peace while telling itself to press an
 * advantage. No separate deception panel needed; the comparison is the panel.
 */
async function drawDiplomacy(relationLines) {
  const threads = await allMessages();
  // A private thread is readable by exactly two civs. In agent mode a thread
  // this civ is not part of does not exist.
  const visible = [...threads].filter(([key, list]) =>
    list.some((m) => m.turn <= S.turn) && (
      S.mode !== "agent" || !S.focus || key === "public" || key.split("|").includes(S.focus)
    )
  );
  if (!visible.length) {
    $("messages").innerHTML = `<div class="empty">Nobody has spoken.</div>` +
      (relationLines.length ? `<div style="margin-top:8px">${relationLines.join("")}</div>` : "");
    return;
  }
  if (!visible.some(([key]) => key === S.thread)) S.thread = visible[0][0];

  const chip = (pid) =>
    `<span class="dot" style="background:${cssOf(pid)}"></span>${esc(nameOf(pid))}`;
  const tabs = visible.map(([key, list]) => {
    const sofar = list.filter((m) => m.turn <= S.turn);
    // Whether anything landed here on the turn being viewed. A thread that just
    // moved is the one worth opening, and finding it by clicking each tab in
    // turn is not reading, it is searching.
    const live = sofar.some((m) => m.turn === S.turn);
    let label;
    if (key === "public") {
      label = "public";
    } else {
      // The arrow points from whoever spoke *last*, as of this turn - so a
      // reply flips it. On turn 5 that reads gemini -> gpt because gemini
      // opened; on turn 6 it reads gpt -> gemini because gpt answered, which
      // is the fact you want without opening the thread.
      //
      // It used to be pinned to whoever opened the thread and never moved
      // again, which is true and static: correct on turn 5 and stale for the
      // fifteen turns after it.
      const latest = sofar[sofar.length - 1] || list[0];
      const from = latest.from;
      const to = latest.to || key.split("|").find((p) => p !== from) || from;
      label = `${chip(from)} <span class="arrow">→</span> ${chip(to)}`;
    }
    return `<button class="thread ${live ? "live" : ""}" data-key="${key}"
      aria-pressed="${key===S.thread}"
      >${label} <span class="meta">${sofar.length}</span></button>`;
  }).join("");

  // Up to and including this turn, never past it. Threading the whole match at
  // once was the right instinct and the wrong scope: it meant standing on turn 1
  // and reading a pact negotiated on turn 28. Every other panel here is "as of
  // turn N" - the fog, the dossier fold, the cost fold - and this one silently
  // was not, which spoils the replay and breaks the one question the scrubber
  // exists to answer: what did they know, and when.
  // Newest first. A negotiation is read from its live end - what was just said
  // is what you are deciding about - and a chronological thread buries that
  // under everything already known, further down the further the match runs.
  const upToNow = (threads.get(S.thread) || []).filter((m) => m.turn <= S.turn).reverse();
  const body = upToNow.length ? upToNow.map((m) => {
    // Three things arrive in a thread and they are not the same act. A message
    // is talk; a proposal is talk with a binding offer attached; a reply either
    // signs it or does not. Labelling all three "private" hid the only part
    // that changes the board.
    const tag = m.kind === "proposal" ? `proposes ${esc(m.type || "terms")}`
      : m.kind === "reply" ? (m.response === "accept" ? "accepts" : "declines")
      : null;
    return `<div class="msg ${m.channel} ${m.kind || "message"} ${
      m.turn===S.turn?"now":""}" data-turn="${m.turn}">
      <div class="meta"><span class="chan ${m.channel}">${
        m.channel === "private" ? "private" : "public"}</span>${
        tag ? ` <span class="chan ${m.kind} ${m.response||""}">${tag}</span>` : ""} turn ${m.turn} ·
        <span class="dot" style="background:${cssOf(m.from)}"></span>${nameOf(m.from)}${
        m.to ? ` → <span class="dot" style="background:${cssOf(m.to)}"></span>${nameOf(m.to)}`
             : " · to everyone"}</div>${
        // Said in so many words, because a blank space below a chip reads as a
        // rendering failure rather than as a choice. A model signing a pact
        // without comment is a real and slightly cold thing to have done, and
        // the panel should say so rather than leave a gap.
        m.text ? linkRefs(esc(m.text))
               : `<span class="wordless">${m.kind === "reply"
                    ? `signed without comment` : `sent with no note attached`}</span>`}
      ${m.turn === S.turn && f_reasoning(m.from) ? `<div class="aside">
        <b>its plan that turn:</b> ${linkRefs(esc(f_reasoning(m.from)))}</div>` : ""}</div>`;
  }).join("") : `<div class="empty">Nothing said in this thread yet.</div>`;

  $("messages").innerHTML = `<div class="threads">${tabs}</div>${body}` +
    (relationLines.length ? `<div style="margin-top:8px">${relationLines.join("")}</div>` : "");
  $("messages").onclick = (ev) => {
    const tab = ev.target.closest(".thread");
    if (tab) { S.thread = tab.dataset.key; panels(); return; }
    const msg = ev.target.closest(".msg[data-turn]");
    // Clicking a message jumps the scrubber to it, which is what turns a
    // transcript into a way of navigating the match.
    if (msg && +msg.dataset.turn !== S.turn) show(+msg.dataset.turn);
  };
}

/**
 * Turn coordinates and unit ids in a model's prose into things you can point at.
 *
 * Agents write "Move settler u64 to (-8,0) en route to site (-9,-1)". Every one
 * of those references is exact and, on a 1027-tile board, unfindable by eye -
 * so the reasoning panel described a board the reader could not locate.
 *
 * Applied *after* escaping, never before: the input is model output and goes
 * into `innerHTML`. `esc` runs first, this only ever inserts spans around text
 * that is already inert, and the pattern matches digits and commas rather than
 * anything that could carry markup.
 *
 * A unit resolves to the tile it currently stands on. Highlighting the mesh
 * itself would be better and is much more work - instanced meshes share one
 * material - and the tile is enough to answer "where is it".
 */
// One pass, one alternation. Two sequential `replace` calls would rescan the
// markup the first one inserted, and a coordinate pattern hiding inside an
// attribute is the kind of bug that only shows up on one sentence in a hundred.
//
// No `\b` before the number: a word boundary does not exist between a space and
// a minus, so `-13,6` matched as `13,6`, resolved to a different tile or none,
// and the pill silently vanished from every negative coordinate - which on this
// map is most of them.
const REF_RE = /\bu(\d{1,4})\b|\(?(-?\d{1,2}),\s?(-?\d{1,2})\)?/g;

function linkRefs(escaped) {
  if (!escaped) return escaped;
  return escaped.replace(REF_RE, (whole, unitId, q, r) => {
    if (unitId !== undefined) {
      const unit = (S.frame?.units || []).find((u) => u.id === `u${unitId}`);
      // A dead unit still gets a pill, marked. The sentence referred to
      // something real when it was written, and "this no longer exists" is
      // itself worth seeing when reading back an old turn.
      return unit
        ? `<span class="ref unit" data-tile="${unit.at}">${whole}</span>`
        : `<span class="ref gone" title="no longer on the board">${whole}</span>`;
    }
    const index = tileAt(`${q},${r}`);
    return index == null ? whole : `<span class="ref" data-tile="${index}">${whole}</span>`;
  });
}

/** The sender's own private plan on a given turn, if this frame carries it. */
function f_reasoning(playerId) {
  const r = S.frame?.reasoning?.[playerId];
  return r ? (r.plan || r.assessment || "") : "";
}

async function show(turn) {
  S.turn = Math.max(1, Math.min(turn, S.match.turns));
  S.frame = await loadFrame(S.turn);
  $("slider").value = S.turn;
  $("turnLabel").textContent = `turn ${S.turn} / ${S.match.turns}`;
  const v = S.match.victory;
  $("status").textContent = v && S.turn >= S.match.turns
    ? `${nameOf(v.winner)} won by ${v.condition}` : "";
  await drawTurn();
  panels();
  for (const t of [S.turn+1, S.turn+2]) if (t <= S.match.turns) loadFrame(t).catch(()=>{});
}

function togglePlay() {
  if (S.playing) { clearInterval(S.playing); S.playing = null; $("play").textContent = "▶ Play"; return; }
  $("play").textContent = "❚❚ Pause";
  S.playing = setInterval(async () => {
    if (S.turn >= S.match.turns) return togglePlay();
    await show(S.turn + 1);
  }, 700);
}

/**
 * The match library.
 *
 * `library.json` carries the facts, derived from each bundle and rebuildable at
 * any time. Names and stars are *not* in it: a published bundle is a static
 * directory with no write path, so persisting an annotation would mean either a
 * server - which this viewer exists in order not to need - or a CLI nobody would
 * run mid-scrub. They live in `localStorage` instead.
 *
 * That trade is worth stating plainly, because it is a real limitation rather
 * than an implementation detail: a name you type is yours, in this browser, and
 * does not travel with a match you publish or open elsewhere. For a lab notebook
 * that is the right answer. For a shared catalogue it would not be, and the fix
 * then is a real store rather than a bigger `localStorage` key.
 */
const NOTES_KEY = "arena4x.notes.v1";

function notes() {
  try {
    return JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
  } catch {
    // A corrupt key should cost the annotations, not the viewer.
    return {};
  }
}

function note(id, patch) {
  const all = notes();
  all[id] = { ...(all[id] || {}), ...patch };
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(all));
  } catch {
    /* private mode, or full. The list still works, it just forgets. */
  }
}

async function loadLibrary() {
  if (S.library) return S.library;
  try {
    const res = await fetch("library.json", { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    S.library = (await res.json()).matches || [];
  } catch {
    // Served straight from a single bundle, which is the published case. There
    // is no shelf to go back to, so the title simply is not a button.
    S.library = [];
  }
  return S.library;
}

function drawLibrary() {
  const all = S.library || [];
  const kept = notes();
  const find = $("libFind").value.trim().toLowerCase();
  const label = (m) => kept[m.path]?.name || m.id;
  const hay = (m) =>
    [label(m), m.id, ...(m.models || []), m.condition || "", m.winner_name || ""]
      .join(" ")
      .toLowerCase();

  const shown = all
    .filter((m) => !find || hay(m).includes(find))
    // Starred first, then newest. Sorting starred to the top is the whole point
    // of starring: a flat list re-sorted by date buries the match you keep
    // coming back to under every experiment run since.
    .sort((a, b) => {
      const star = (kept[b.path]?.star ? 1 : 0) - (kept[a.path]?.star ? 1 : 0);
      return star || String(b.finished_at).localeCompare(String(a.finished_at));
    });

  const dot = (name, i) =>
    `<span class="dot" style="background:${CSS[i % CSS.length]}" title="${esc(name)}"></span>`;

  $("libList").innerHTML =
    shown
      .map((m) => {
        const starred = !!kept[m.path]?.star;
        const here = m.path === BASE || `${m.path}/` === `${BASE}/`;
        // A trailing "~" marks a date inferred from the file rather than
        // recorded by the run. Shown as such instead of silently rounded, so a
        // rebuilt bundle does not quietly claim to have been played today.
        const approx = String(m.finished_at).endsWith("~");
        const when = String(m.finished_at).replace("~", "").replace("T", " ").slice(0, 16);
        const outcome = m.condition
          ? `${esc(m.condition)}${m.winner_name ? ` → ${esc(m.winner_name)}` : ""}`
          : "unfinished";
        return `<div class="match ${here ? "here" : ""}" data-path="${esc(m.path)}">
        <button class="star ${starred ? "on" : ""}" data-star="${esc(m.path)}"
          aria-pressed="${starred}" title="${starred ? "Unstar" : "Star"}"
          >${starred ? "★" : "☆"}</button>
        <div>
          <div class="title">${esc(label(m))}
            <button class="rename" data-rename="${esc(m.path)}" title="Rename">rename</button>
            ${here ? `<span class="meta">open</span>` : ""}</div>
          <div class="who">${(m.models || []).map(dot).join("")}
            <span class="sub">${(m.models || []).map(esc).join(" · ")}</span></div>
          <div class="sub">${m.turns} turns · ${outcome}${
            m.spent_usd != null ? ` · $${Number(m.spent_usd).toFixed(2)}` : ""
          }</div>
        </div>
        <div class="right">${esc(when)}${approx ? `<br><span class="approx">from file</span>` : ""}
          <br>seed ${m.seed ?? "?"}</div>
      </div>`;
      })
      .join("") ||
    `<div class="empty" style="padding:14px">${
      all.length ? "Nothing matches that search." : "No matches indexed. Run <b>make library</b>."
    }</div>`;
}

function openLibrary(show) {
  $("libWrap").hidden = !show;
  if (show) {
    drawLibrary();
    $("libFind").focus();
  }
}

function wireLibrary() {
  const shelf = (S.library || []).length;
  // With nothing to switch to, the title is not a control. Better than a button
  // that opens an empty box and teaches the visitor it does nothing.
  if (!shelf) {
    $("libBtn").querySelector(".caret").remove();
    $("libBtn").removeAttribute("aria-haspopup");
    return;
  }
  $("libBtn").onclick = () => openLibrary(true);
  $("libClose").onclick = () => openLibrary(false);
  $("libFind").oninput = drawLibrary;
  // Click the backdrop, not the dialog. Closing on any click inside would make
  // the search field unusable.
  $("libWrap").onclick = (e) => e.target === $("libWrap") && openLibrary(false);
  addEventListener("keydown", (e) => e.key === "Escape" && openLibrary(false));

  $("libList").onclick = (e) => {
    const star = e.target.closest("[data-star]");
    if (star) {
      const path = star.dataset.star;
      note(path, { star: !notes()[path]?.star });
      drawLibrary();
      return;
    }
    const rename = e.target.closest("[data-rename]");
    if (rename) {
      const path = rename.dataset.rename;
      const current = notes()[path]?.name || "";
      // `prompt` deliberately. An inline editor here would be a text input, a
      // commit key, an escape path and a blur rule - four behaviours to get
      // right for a field used once per match. Not `confirm`/`alert`, which are
      // the modal calls worth avoiding.
      const next = window.prompt("Name this match", current);
      if (next !== null) note(path, { name: next.trim() || undefined });
      drawLibrary();
      return;
    }
    const row = e.target.closest(".match[data-path]");
    if (!row) return;
    const path = row.dataset.path;
    if (path === BASE) return openLibrary(false);
    // A full navigation rather than swapping the data in place. Terrain, scatter
    // and resources are built once at init from the match being viewed, so
    // loading another one means rebuilding every layer plus resetting the
    // camera, the fold caches, the thread selection and the scrubber. The URL
    // already selects a match; letting it do so is both less code and shareable.
    location.search = `?match=${encodeURIComponent(path)}`;
  };
}

/**
 * Tooltips, drawn rather than delegated to the browser.
 *
 * Every explained element already carries its text in `title`, which keeps it
 * available to screen readers and to anyone reading the DOM - but the native
 * bubble is unreliable exactly where it is needed here. It waits about a
 * second, it renders wherever it likes, and on a column header at the right
 * edge of a narrow panel it lands off-screen often enough that the honest
 * description is "the cursor changes and nothing happens".
 *
 * Bound once on the panel by delegation, so anything gaining a `title` later
 * gets this for free. `title` is moved to `data-tip` while hovered and put
 * back on the way out, which suppresses the duplicate native bubble without
 * losing the attribute.
 */
function tooltips(root) {
  const tip = $("tip");
  let held = null;

  const place = (el) => {
    const box = el.getBoundingClientRect();
    // Laid out but not yet painted, so it can be measured before it is placed -
    // otherwise the first frame appears at the previous tooltip's position.
    tip.style.visibility = "hidden";
    tip.classList.add("on");
    const own = tip.getBoundingClientRect();
    // Prefer below-left of the element, then flip up or in when that would
    // leave the viewport. The panel is at the right edge, so the horizontal
    // clamp is the one that actually fires.
    const left = Math.max(8, Math.min(box.left, window.innerWidth - own.width - 8));
    const below = box.bottom + 6;
    const top = below + own.height > window.innerHeight - 8 ? box.top - own.height - 6 : below;
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(8, top)}px`;
    tip.style.visibility = "";
  };

  const show = (el) => {
    const text = el.getAttribute("title") || el.dataset.tip;
    if (!text) return;
    if (el.hasAttribute("title")) {
      el.dataset.tip = text;
      el.removeAttribute("title");
    }
    held = el;
    tip.textContent = text;
    tip.setAttribute("aria-hidden", "false");
    place(el);
  };

  const hide = () => {
    if (held?.dataset.tip) {
      held.setAttribute("title", held.dataset.tip);
      delete held.dataset.tip;
    }
    held = null;
    tip.classList.remove("on");
    tip.setAttribute("aria-hidden", "true");
  };

  root.addEventListener("mouseover", (ev) => {
    const el = ev.target.closest("[title], [data-tip]");
    if (el === held) return;
    hide();
    if (el && root.contains(el)) show(el);
  });
  root.addEventListener("mouseleave", hide);
  // Scrolling the panel moves the anchor out from under a fixed-position
  // bubble, which then points at the wrong row.
  root.addEventListener("scroll", hide, true);
}

(async function init() {
  await loadLibrary();

  // Served from a directory of runs rather than from inside one: there is no
  // match at the root, so the library *is* the page. Without this the viewer
  // threw on a missing match.json and showed a blank canvas, which is a
  // confusing way to say "pick something".
  const res = await fetch(`${BASE}/match.json`, { cache: "no-store" });
  if (!res.ok) {
    document.querySelector("aside").hidden = true;
    document.querySelector(".scrub").hidden = true;
    document.querySelector(".hint").hidden = true;
    $("status").textContent = "Pick a match";
    wireLibrary();
    openLibrary(true);
    return;
  }
  S.match = await res.json();

  // Key -> index, so a coordinate written in prose can be found in O(1).
  S.tileIndex = new Map(S.match.tiles.map((key, i) => [key, i]));

  staticLayer.add(buildTerrain(S.match.tiles, S.match.terrain));
  staticLayer.add(buildScatter(S.match.tiles, S.match.terrain));
  staticLayer.add(buildResources(S.match.tiles, S.match.terrain, S.match.resources));

  // Frame the board from its actual bounds. A hardcoded camera distance cropped
  // the map off every edge, and would have broken again on any other radius.
  const pts = S.match.tiles.map((k) => axialToWorld(...k.split(",").map(Number)));
  const x0 = Math.min(...pts.map((p)=>p[0])), x1 = Math.max(...pts.map((p)=>p[0]));
  const z0 = Math.min(...pts.map((p)=>p[2])), z1 = Math.max(...pts.map((p)=>p[2]));
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const extent = Math.max(x1 - x0, z1 - z0);
  resize();
  // Fit the wider of the two axes, allowing for the viewport being wider than
  // it is tall, then back off a little so the board is not flush to the frame.
  const vFov = (camera.fov * Math.PI) / 180;
  const fit = extent / (2 * Math.tan(vFov / 2) * Math.min(1, camera.aspect)) * 1.15;
  // The opening camera, kept so "Reset view" can return to it exactly. Now that
  // zooming follows the cursor it is very easy to end up somewhere odd, and
  // "back to how it looked" needs to be one click rather than a hunt.
  S.home = {
    target: new THREE.Vector3(cx, 0, cz),
    dist: fit,
    eye: new THREE.Vector3(cx, fit * 0.72, cz + fit * 0.66),
  };
  controls.target.copy(S.home.target);
  camera.position.copy(S.home.eye);
  scene.fog.near = fit * 0.9;
  scene.fog.far = fit * 2.4;

  // "All empires", not "God". The mode means the same thing - no fog, ground
  // truth, every civ at once - and the old label was a word this project would
  // rather not put on a page it publishes. It also described the *viewer*
  // rather than the view; the civ options beside it name what you are looking
  // through, so this one names it too.
  const ALL = "All empires";
  const dot = (c) => `<span class="dot" style="background:${CSS[c.colour]}"></span>`;
  $("viewMenu").innerHTML = `
    <div class="group">Fog of war</div>
    <button role="menuitemradio" data-mode="god" data-label="${ALL}"
      aria-checked="true">${ALL}</button>
    ${S.match.civs.map((c) => `<button role="menuitemradio" data-mode="agent:${c.player_id}"
      data-label="${esc(c.model || c.civ_name)}" aria-checked="false">${dot(c)}${
      esc(c.model || c.civ_name)}</button>`).join("")}
    <div class="group">Camera</div>
    <button role="menuitem" data-camera="top">Top-down</button>
    <button role="menuitem" data-camera="home">Reset view</button>`;

  const closeMenu = () => {
    $("viewMenu").hidden = true;
    $("viewBtn").setAttribute("aria-expanded", "false");
  };
  $("viewBtn").onclick = (e) => {
    e.stopPropagation();
    const open = $("viewMenu").hidden;
    $("viewMenu").hidden = !open;
    $("viewBtn").setAttribute("aria-expanded", String(open));
  };
  // Dismissed by clicking anywhere else or by Escape. Both, because a menu that
  // can only be closed by the button that opened it is a trap on a page whose
  // main surface is a canvas you drag.
  addEventListener("click", closeMenu);
  addEventListener("keydown", (e) => e.key === "Escape" && closeMenu());

  $("viewMenu").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.camera) {
      controls.target.copy(S.home.target);
      if (b.dataset.camera === "top") {
        camera.position.set(S.home.target.x, S.home.dist * 1.05, S.home.target.z + 0.01);
      } else {
        camera.position.copy(S.home.eye);
      }
      controls.update();
      closeMenu();
      return;
    }
    const [mode, who] = b.dataset.mode.split(":");
    S.mode = mode;
    S.focus = who || null;
    for (const x of $("viewMenu").querySelectorAll("[data-mode]")) {
      x.setAttribute("aria-checked", String(x === b));
    }
    $("viewNow").textContent = b.dataset.label;
    closeMenu();
    // The panels are fog-aware now, so a mode change has to redraw them too.
    S.expanded = S.focus;
    drawTurn();
    panels();
  };
  tooltips(document.querySelector("aside"));
  // Delegated, so it covers every panel that renders model prose and keeps
  // working as those panels are re-rendered each turn.
  const aside = document.querySelector("aside");
  aside.addEventListener("mouseover", (ev) => {
    const ref = ev.target.closest(".ref[data-tile]");
    if (ref) pointAt(+ref.dataset.tile);
  });
  aside.addEventListener("mouseout", (ev) => {
    if (ev.target.closest(".ref[data-tile]")) clearPointer();
  });
  aside.addEventListener("scroll", clearPointer, true);
  wireLibrary();
  $("slider").max = S.match.turns;
  $("slider").oninput = (e) => show(+e.target.value);
  $("prev").onclick = () => show(S.turn - 1);
  $("next").onclick = () => show(S.turn + 1);
  $("play").onclick = togglePlay;
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(S.turn - 1);
    if (e.key === "ArrowRight") show(S.turn + 1);
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
  });
  await show(1);
})();
</script>
